{{- if .Values.global.analyticsEnabled }}
{{- $stores := list (dict "name" "cassandra" "image" .Values.platform.cassandraImage "port" 9042 "memory" "1Gi") (dict "name" "clickhouse" "image" .Values.platform.clickhouseImage "port" 8123 "memory" "768Mi") }}
{{- range $store := $stores }}
{{- $initialization := index $.Values.assets "bank10-analytics-setup" (printf "init-%s.sh" $store.name) }}
{{- if eq $store.name "clickhouse" }}
{{- $initialization = printf "%s\n%s\n%s" $initialization (index $.Values.assets "bank10-analytics-setup" "init-clickhouse.sql") (index $.Values.assets "bank10-analytics-setup" "activity-marts.sql") }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $store.name }}
  labels:
    {{- include "bank.labels" $ | nindent 4 }}
spec:
  selector: {app: {{ $store.name }}, bank10.io/instance: {{ $.Release.Name }}}
  ports:
    - {name: client, port: {{ $store.port }}, targetPort: {{ $store.port }}}
    {{- if eq $store.name "clickhouse" }}
    - {name: native, port: 9000, targetPort: 9000}
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $store.name }}
  labels:
    {{- include "bank.labels" $ | nindent 4 }}
spec:
  serviceName: {{ $store.name }}
  replicas: 1
  selector:
    matchLabels: {app: {{ $store.name }}, bank10.io/instance: {{ $.Release.Name }}}
  template:
    metadata:
      labels: {app: {{ $store.name }}, bank10.io/instance: {{ $.Release.Name }}, bank10.io/role: storage}
      annotations: {checksum/public-config: {{ toJson $.Values.assets | sha256sum }}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      nodeSelector:
        {{- toYaml $.Values.global.nodeSelector | nindent 8 }}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $store.name }}
          image: {{ $store.image | quote }}
          command: [bash, {{ printf "/setup/start-%s.sh" $store.name | quote }}]
          {{- if eq $store.name "cassandra" }}
          args: [cassandra, -f]
          env:
            - {name: CASSANDRA_CLUSTER_NAME, value: bank10}
            - {name: CASSANDRA_DC, value: datacenter1}
            - {name: CASSANDRA_ENDPOINT_SNITCH, value: GossipingPropertyFileSnitch}
            - {name: CASSANDRA_NUM_TOKENS, value: "16"}
            - {name: MAX_HEAP_SIZE, value: 384M}
            - {name: HEAP_NEWSIZE, value: 64M}
            - {name: JVM_EXTRA_OPTS, value: "-XX:MaxDirectMemorySize=96m -XX:ActiveProcessorCount=2 -XX:ParallelGCThreads=2 -XX:ConcGCThreads=2"}
          {{- else }}
          env: [{name: CLICKHOUSE_SKIP_USER_SETUP, value: "1"}]
          {{- end }}
          ports: [{name: client, containerPort: {{ $store.port }}}]
          readinessProbe:
            tcpSocket: {port: client}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 100m, memory: {{ $store.memory }}}
            limits: {cpu: "1.5", memory: {{ $store.memory }}}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if eq $store.name "cassandra" }}
            - {name: data, mountPath: /var/lib/cassandra}
            - {name: logs, mountPath: /var/log/cassandra}
            {{- else }}
            - {name: data, mountPath: /var/lib/clickhouse}
            - {name: cold, mountPath: /var/lib/clickhouse-cold}
            - {name: logs, mountPath: /var/log/clickhouse-server}
            - {name: users, mountPath: /etc/clickhouse-server/users.d}
            - {name: storage-config, mountPath: /etc/clickhouse-server/config.d/bank.xml, subPath: clickhouse-storage.xml, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            {{- end }}
      volumes:
        - {name: setup, configMap: {name: bank10-analytics-setup}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
        - {name: logs, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
        {{- if eq $store.name "cassandra" }}
        - {name: data, persistentVolumeClaim: {claimName: cassandra-data}}
        {{- else }}
        - {name: data, persistentVolumeClaim: {claimName: analytics-hot}}
        - {name: cold, persistentVolumeClaim: {claimName: analytics-cold}}
        - {name: users, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        - {name: storage-config, configMap: {name: bank10-analytics-setup}}
        - {name: secrets, secret: {secretName: {{ printf "%s-clickhouse" $.Values.global.secretPrefix }}, defaultMode: 0400}}
        {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $store.name }}-init-{{ $initialization | sha256sum | trunc 10 }}
  labels:
    {{- include "bank.labels" $ | nindent 4 }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {app: {{ $store.name }}-init, bank10.io/instance: {{ $.Release.Name }}, bank10.io/role: initializer}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: initializer
          image: {{ $store.image | quote }}
          command: [bash, {{ printf "/setup/init-%s.sh" $store.name | quote }}]
          securityContext:
            {{- include "bank.containerSecurity" $ | nindent 12 }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: setup, configMap: {name: bank10-analytics-setup}}
        - {name: secrets, secret: {secretName: {{ printf "%s-%s" $.Values.global.secretPrefix $store.name }}, defaultMode: 0400}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 8Mi}}
{{- end }}
{{- end }}
