spring.application.name=payments
spring.config.import=optional:configtree:${PAYMENTS_SECRETS_DIR:./secrets/}
spring.profiles.default=h2
spring.main.web-application-type=reactive
server.port=${PAYMENTS_SERVER_PORT:18098}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
spring.r2dbc.pool.initial-size=1
spring.r2dbc.pool.max-size=5
spring.r2dbc.pool.max-acquire-time=2s
spring.r2dbc.pool.max-create-connection-time=2s
spring.r2dbc.pool.max-idle-time=5m
spring.sql.init.mode=${PAYMENTS_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/schema.sql,classpath:db/${spring.sql.init.platform}-timeouts.sql
spring.codec.max-in-memory-size=8KB
# issuer-uri включает проверку iss, jwk-set-uri отключает discovery при старте: Keycloak может подняться позже сервиса.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${PAYMENTS_OAUTH_ISSUER:http://localhost:18381/realms/storefront-api}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${PAYMENTS_OAUTH_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256
spring.security.oauth2.resourceserver.jwt.audiences=payments
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.parser.strict-duplicate-detection=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,r2dbc
