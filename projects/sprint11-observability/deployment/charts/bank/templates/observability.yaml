{{- /* ---------------------------------------------------------------- Elasticsearch */}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels: {app: elasticsearch, bank11.io/instance: {{ $release }}}
  template:
    metadata:
      labels: {app: elasticsearch, bank11.io/instance: {{ $release }}, bank11.io/role: storage}
      annotations: {checksum/public-config: {{ pick $elkAsset "elasticsearch.yml" "elasticsearch-probe.sh" | toJson | sha256sum }}}
    spec:
      automountServiceAccountToken: false
      # Service links would inject ELASTICSEARCH_*, LOGSTASH_*, ... variables into images that read their own settings from the environment.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # The root filesystem is read-only, but Elasticsearch writes its keystore into the config directory:
        # seed a writable copy of the image defaults and drop our elasticsearch.yml over it.
        - name: config-seed
          image: {{ $obs.images.elasticsearch | quote }}
          command: [sh, -ec, "cp -R /usr/share/elasticsearch/config/. /seed/ && cp /setup/elasticsearch.yml /seed/elasticsearch.yml && find /seed -mindepth 1 -exec chmod u+rwX,g+rX {} +"]
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $obs.resources.job | nindent 12 }}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: config, mountPath: /seed}
      containers:
        - name: elasticsearch
          image: {{ $obs.images.elasticsearch | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: ES_JAVA_OPTS, value: "-Xms256m -Xmx256m"}
            - {name: ELASTIC_PASSWORD_FILE, value: /run/secrets/elastic_password}
          ports: [{name: http, containerPort: 9200}]
          startupProbe:
            exec: {command: [sh, /setup/elasticsearch-probe.sh, ready]}
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 120
          readinessProbe:
            exec: {command: [sh, /setup/elasticsearch-probe.sh, ready]}
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            exec: {command: [sh, /setup/elasticsearch-probe.sh, live]}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $obs.resources.elasticsearch | nindent 12 }}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: config, mountPath: /usr/share/elasticsearch/config}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: data, mountPath: /usr/share/elasticsearch/data}
            - {name: logs, mountPath: /usr/share/elasticsearch/logs}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: setup
          configMap:
            name: bank11-elk
            items:
              - {key: elasticsearch.yml, path: elasticsearch.yml}
              - {key: elasticsearch-probe.sh, path: elasticsearch-probe.sh}
        - {name: config, emptyDir: {sizeLimit: 16Mi}}
        - name: secrets
          secret:
            secretName: {{ printf "%s-elasticsearch" $prefix }}
            defaultMode: 0440
            items: [{key: elastic_password, path: elastic_password}]
        - {name: data, persistentVolumeClaim: {claimName: elasticsearch-data}}
        - {name: logs, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-bootstrap-{{ dict "script" (pick $elkAsset "elasticsearch-bootstrap.sh" "ilm-policy.json" "index-template.json") "retention" $obs.retention.logsTime | toJson | sha256sum | trunc 10 }}
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {app: elasticsearch-bootstrap, bank11.io/instance: {{ $release }}, bank11.io/role: initializer}
    spec:
      automountServiceAccountToken: false
      # Service links would inject ELASTICSEARCH_*, LOGSTASH_*, ... variables into images that read their own settings from the environment.
      enableServiceLinks: false
      restartPolicy: Never
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: {{ $obs.images.elasticsearch | quote }}
          command: [sh, /setup/elasticsearch-bootstrap.sh]
          env:
            - {name: LOGS_RETENTION, value: {{ $obs.retention.logsTime | quote }}}
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $obs.resources.job | nindent 12 }}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: setup
          configMap:
            name: bank11-elk
            items:
              - {key: elasticsearch-bootstrap.sh, path: elasticsearch-bootstrap.sh}
              - {key: ilm-policy.json, path: ilm-policy.json}
              - {key: index-template.json, path: index-template.json}
        - name: secrets
          secret:
            secretName: {{ printf "%s-elasticsearch" $prefix }}
            defaultMode: 0440
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 8Mi}}

{{- /* ---------------------------------------------------------------- Kibana */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: kibana, bank11.io/instance: {{ $release }}}
  template:
    metadata:
      labels: {app: kibana, bank11.io/instance: {{ $release }}, bank11.io/role: observability}
      annotations: {checksum/public-config: {{ pick $elkAsset "kibana.yml" "kibana-start.sh" | toJson | sha256sum }}}
    spec:
      automountServiceAccountToken: false
      # Service links would inject ELASTICSEARCH_*, LOGSTASH_*, ... variables into images that read their own settings from the environment.
      enableServiceLinks: false
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kibana
          image: {{ $obs.images.kibana | quote }}
          imagePullPolicy: IfNotPresent
          # Keeps the image's tini as PID 1 and wraps Kibana in the Secret-reading start script.
          command: [/bin/tini, --, /bin/bash, /setup/kibana-start.sh]
          env:
            - {name: SERVER_PUBLICBASEURL, value: {{ printf "https://%s:%v" $obs.publicHosts.kibana .Values.global.externalPort | quote }}}
            # 448 MiB вызывали V8 OOM при холодном старте; Kibana 9.4+ сама выбирает heap по cgroup.
          ports: [{name: http, containerPort: 5601}]
          startupProbe:
            httpGet: {path: /api/status, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /api/status, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            # Kibana reports unavailable while Elasticsearch is down; restarting it would not help, so liveness
            # only proves the Node.js server still accepts connections.
            tcpSocket: {port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $obs.resources.kibana | nindent 12 }}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: settings, mountPath: /usr/share/kibana/config/kibana.yml, subPath: kibana.yml, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: data, mountPath: /usr/share/kibana/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: setup
          configMap:
            name: bank11-elk
            items: [{key: kibana-start.sh, path: kibana-start.sh}]
        - name: settings
          configMap:
            name: bank11-elk
            items: [{key: kibana.yml, path: kibana.yml}]
        - name: secrets
          secret:
            secretName: {{ printf "%s-kibana" $prefix }}
            defaultMode: 0440
            items:
              - {key: kibana_system_password, path: kibana_system_password}
              - {key: kibana_encryption_key, path: kibana_encryption_key}
        - {name: data, emptyDir: {sizeLimit: 256Mi}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-bootstrap-{{ pick $elkAsset "kibana-bootstrap.sh" "kibana-data-view.json" "kibana-objects.ndjson" | toJson | sha256sum | trunc 10 }}
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {app: kibana-bootstrap, bank11.io/instance: {{ $release }}, bank11.io/role: initializer}
    spec:
      automountServiceAccountToken: false
      # Service links would inject ELASTICSEARCH_*, LOGSTASH_*, ... variables into images that read their own settings from the environment.
      enableServiceLinks: false
      restartPolicy: Never
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: {{ $obs.images.kibana | quote }}
          command: [/bin/bash, /setup/kibana-bootstrap.sh]
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $obs.resources.job | nindent 12 }}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: setup
          configMap:
            name: bank11-elk
            items:
              - {key: kibana-bootstrap.sh, path: kibana-bootstrap.sh}
