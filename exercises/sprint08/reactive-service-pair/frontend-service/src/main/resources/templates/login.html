<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Войти · WebFlux</title><link rel="stylesheet" href="/style.css"></head>
<body><main><p class="label">ЛОКАЛЬНАЯ АУТЕНТИФИКАЦИЯ</p><h1>Войти.</h1><p>Пользователь входит во фронтенд. Его пароль не передаётся бэкенду.</p><p class="error" role="alert" th:if="${param.error != null and !param.error.isEmpty()}">Неверное имя пользователя или пароль.</p><form th:action="@{/login}" method="post"><label for="username">Имя пользователя</label><input id="username" name="username" autocomplete="username" required value="user"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Войти</button></form><p class="hint">Пароль учебного пользователя находится в локальном target/lab.env.</p></main></body></html>
