global:
  resolve_timeout: 5m
  # Чарт подставляет observability.alerting.telegram.apiUrl: настоящий Bot API в эксплуатации
  # или локальный приёмник POST /bot<token>/sendMessage в CI. Реальный чат в CI не используется.
  telegram_api_url: "@TELEGRAM_API_URL@"
route:
  receiver: telegram-warning
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: telegram-critical
      repeat_interval: 1h
inhibit_rules:
  # Недоступный endpoint метрик вызовет и предупреждения latency/ratio/JVM; достаточно одного сообщения.
  - source_matchers:
      - alertname="BankServiceDown"
    target_matchers:
      - severity="warning"
    equal: [service]
receivers:
  - name: telegram-critical
    telegram_configs:
      # Оба значения читаются из смонтированных Secret при отправке; их нет в этой конфигурации,
      # values чарта и состоянии Helm.
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: HTML
        message: |-
          <b>[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}</b> ({{ .CommonLabels.severity }})
          {{ range .Alerts -}}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          First step: {{ .Annotations.action }}
          {{ end }}
  - name: telegram-warning
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: true
        # Предупреждения приходят без звука; критические оповещения — со звуком.
        disable_notifications: true
        parse_mode: HTML
        message: |-
          <b>[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}</b> ({{ .CommonLabels.severity }})
          {{ range .Alerts -}}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          First step: {{ .Annotations.action }}
          {{ end }}
