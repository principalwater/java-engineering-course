name: bank10

x-java: &java
  user: "${BANK_UID:-10001}:${BANK_GID:-10001}"
  read_only: true
  tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: 384m
  memswap_limit: 384m
  cpus: 1.0
  depends_on:
    config-seed: {condition: service_completed_successfully}
    database: {condition: service_started}
    authorization: {condition: service_started}

x-application: &application
  SERVER_PORT: '8080'
  SERVER_SHUTDOWN: graceful
  SPRING_CLOUD_ZOOKEEPER_CONNECT_STRING: discovery:2181
  SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_PORT: '8080'
  SPRING_CLOUD_ZOOKEEPER_CONNECTION_TIMEOUT: '5000'
  SPRING_CLOUD_ZOOKEEPER_SESSION_TIMEOUT: '10000'
  SPRING_CLOUD_ZOOKEEPER_CONFIG_WATCH_ENABLED: 'false'
  BANK_SECURITY_ISSUER: https://auth-bank.valgrind-home.localhost:8450/realms/bank
  BANK_SECURITY_JWK_SET_URI: http://authorization:8080/realms/bank/protocol/openid-connect/certs

x-jdbc: &jdbc
  SPRING_FLYWAY_CONNECTRETRIES: '5'

x-service-client: &service-client
  SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SERVICE_TOKEN_URI: http://authorization:8080/realms/bank/protocol/openid-connect/token
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SERVICE_PROVIDER: service
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SERVICE_AUTHORIZATION_GRANT_TYPE: client_credentials

services:
  database:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    entrypoint: [sh, /setup/start-database.sh]
    command: [postgres, -c, max_connections=100, -c, shared_buffers=64MB]
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_password, db_accounts_password, db_cash_password, db_transfer_password, db_notifications_password, db_analytics_password, db_keycloak_password]
    volumes:
      - bank-data:/var/lib/postgresql/data
      - ./scripts/start-database.sh:/setup/start-database.sh:ro
      - ./database/init-database.sh:/docker-entrypoint-initdb.d/001-bank.sh:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=8m,mode=1777
      - /run/bank-secrets:rw,noexec,nosuid,size=1m,mode=0700
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1.0
  discovery:
    image: zookeeper:3.9.4@sha256:dfa9ba46d14bd52bcb3c1dac3ba91f179cf4cebf7ee576e1c2df09c68fc1d30d
    user: '1000:1000'
    environment:
      ZOO_STANDALONE_ENABLED: 'true'
      ZOO_ADMINSERVER_ENABLED: 'false'
      JVMFLAGS: -Xms64m -Xmx128m -XX:ActiveProcessorCount=2
    volumes:
      - discovery-data:/data
      - discovery-transactions:/datalog
      - ./discovery/zoo.cfg:/conf/zoo.cfg:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
      - /logs:rw,noexec,nosuid,size=16m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
  config-seed:
    image: zookeeper:3.9.4@sha256:dfa9ba46d14bd52bcb3c1dac3ba91f179cf4cebf7ee576e1c2df09c68fc1d30d
    user: "1000:1000"
    entrypoint: [sh, /setup/init-config.sh]
    environment:
      CLIENT_JVMFLAGS: -Xms32m -Xmx64m -XX:ActiveProcessorCount=1
    volumes: ['./discovery/init-config.sh:/setup/init-config.sh:ro']
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /logs:rw,noexec,nosuid,size=8m,mode=1777
    depends_on: [discovery]
    restart: 'no'
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
  authorization:
    image: bank10-authorization:local
    build: ./authorization
    user: "${BANK_UID:-10001}:${BANK_GID:-10001}"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/bank?currentSchema=keycloak&connectTimeout=5
      KC_DB_USERNAME: keycloak
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME: https://auth-bank.valgrind-home.localhost:8450
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: local
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
      JAVA_OPTS_APPEND: -XX:ActiveProcessorCount=2
    secrets: [db_keycloak_password, authorization_admin_password, oauth_front_secret, oauth_accounts_secret, oauth_cash_secret, oauth_transfer_secret, oauth_analytics_secret, demo_alice_password, demo_bob_password, demo_analyst_password]
    volumes:
      - ./authorization/start-authorization.sh:/setup/start-authorization.sh:ro
      - ./authorization/bank-realm.json:/setup/bank-realm.json:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /opt/keycloak/data:rw,noexec,nosuid,size=32m,mode=1777
    depends_on: [database]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 2.0
  accounts:
    <<: *java
    image: bank10-accounts:local
    build: {context: ., args: {SERVICE: accounts}}
    environment:
      <<: [*application, *jdbc, *service-client]
      SPRING_APPLICATION_NAME: accounts
      SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_HOST: accounts
      BANK_SECURITY_AUDIENCE: accounts-api
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/bank?currentSchema=accounts&connectTimeout=5&socketTimeout=15
      SPRING_DATASOURCE_USERNAME: accounts
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SERVICE_CLIENT_ID: accounts-service
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SERVICE_SCOPE: notifications.write,analytics.write
    secrets:
      - {source: db_accounts_password, target: spring.datasource.password}
      - {source: oauth_accounts_secret, target: spring.security.oauth2.client.registration.service.client-secret}
  cash:
    <<: *java
    image: bank10-cash:local
    build: {context: ., args: {SERVICE: cash}}
    environment:
      <<: [*application, *jdbc, *service-client]
      SPRING_APPLICATION_NAME: cash
      SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_HOST: cash
      BANK_SECURITY_AUDIENCE: cash-api
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/bank?currentSchema=cash&connectTimeout=5&socketTimeout=15
      SPRING_DATASOURCE_USERNAME: cash
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SERVICE_CLIENT_ID: cash-service
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SERVICE_SCOPE: accounts.cash,notifications.write
    secrets:
      - {source: db_cash_password, target: spring.datasource.password}
      - {source: oauth_cash_secret, target: spring.security.oauth2.client.registration.service.client-secret}
  transfer:
    <<: *java
    image: bank10-transfer:local
    build: {context: ., args: {SERVICE: transfer}}
    environment:
      <<: [*application, *jdbc, *service-client]
      SPRING_APPLICATION_NAME: transfer
      SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_HOST: transfer
      BANK_SECURITY_AUDIENCE: transfer-api
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/bank?currentSchema=transfer&connectTimeout=5&socketTimeout=15
      SPRING_DATASOURCE_USERNAME: transfer
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SERVICE_CLIENT_ID: transfer-service
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SERVICE_SCOPE: accounts.transfer,notifications.write
    secrets:
      - {source: db_transfer_password, target: spring.datasource.password}
      - {source: oauth_transfer_secret, target: spring.security.oauth2.client.registration.service.client-secret}
  notifications:
    <<: *java
    image: bank10-notifications:local
    build: {context: ., args: {SERVICE: notifications}}
    environment:
      <<: [*application, *jdbc]
      SPRING_APPLICATION_NAME: notifications
      SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_HOST: notifications
      BANK_SECURITY_AUDIENCE: notifications-api
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/bank?currentSchema=notifications&connectTimeout=5&socketTimeout=15
      SPRING_DATASOURCE_USERNAME: notifications
    secrets:
      - {source: db_notifications_password, target: spring.datasource.password}
  gateway:
    <<: *java
    image: bank10-gateway:local
    build: {context: ., args: {SERVICE: gateway}}
    environment:
      <<: *application
      SPRING_APPLICATION_NAME: gateway
      SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_HOST: gateway
      SPRING_THREADS_VIRTUAL_ENABLED: 'false'
      BANK_SECURITY_AUDIENCE: bank-api
    secrets: []
  front:
    <<: *java
    image: bank10-front:local
    build: {context: ., args: {SERVICE: front}}
    environment:
      <<: *application
      SPRING_APPLICATION_NAME: front
      SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_HOST: front
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_SERVLET_SESSION_COOKIE_NAME: __Host-bank-session
      SERVER_SERVLET_SESSION_COOKIE_SECURE: 'true'
      BANK_SECURITY_AUDIENCE: bank-api
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_BANK_ISSUER_URI: https://auth-bank.valgrind-home.localhost:8450/realms/bank
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_BANK_AUTHORIZATION_URI: https://auth-bank.valgrind-home.localhost:8450/realms/bank/protocol/openid-connect/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_BANK_TOKEN_URI: http://authorization:8080/realms/bank/protocol/openid-connect/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_BANK_JWK_SET_URI: http://authorization:8080/realms/bank/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_BANK_USER_INFO_URI: http://authorization:8080/realms/bank/protocol/openid-connect/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_BANK_USER_NAME_ATTRIBUTE: preferred_username
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_BANK_CLIENT_ID: bank-front
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_BANK_PROVIDER: bank
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_BANK_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_BANK_SCOPE: openid,profile,accounts.read,accounts.write,cash.write,transfer.write,analytics.read,analytics.events
    secrets:
      - {source: oauth_front_secret, target: spring.security.oauth2.client.registration.bank.client-secret}
  edge:
    image: bank10-edge:local
    build: {context: ./edge}
    user: "${BANK_UID:-10001}:${BANK_GID:-10001}"
    volumes: ['./edge/Caddyfile:/etc/caddy/Caddyfile:ro']
    secrets: [tls_certificate.pem, tls_private_key.pem]
    ports: ['127.0.0.1:8450:8450']
    networks:
      default:
        aliases: [bank.valgrind-home.localhost, auth-bank.valgrind-home.localhost]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
      - /config:rw,noexec,nosuid,size=8m,mode=1777
      - /data:rw,noexec,nosuid,size=8m,mode=1777
    depends_on: [front, authorization]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5

volumes:
  bank-data:
  discovery-data:
  discovery-transactions:

networks:
  default:
    ipam:
      config: [{subnet: '${BANK_SUBNET:-10.251.9.64/27}'}]

secrets:
  db_admin_password:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/db_admin_password
  db_accounts_password:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/db_accounts_password
  db_cash_password:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/db_cash_password
  db_transfer_password:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/db_transfer_password
  db_notifications_password:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/db_notifications_password
  db_analytics_password:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/db_analytics_password
  db_keycloak_password:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/db_keycloak_password
  authorization_admin_password:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/authorization_admin_password
  oauth_front_secret:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/oauth_front_secret
  oauth_accounts_secret:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/oauth_accounts_secret
  oauth_cash_secret:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/oauth_cash_secret
  oauth_transfer_secret:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/oauth_transfer_secret
  oauth_analytics_secret:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/oauth_analytics_secret
  demo_alice_password:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/demo_alice_password
  demo_bob_password:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/demo_bob_password
  demo_analyst_password:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/demo_analyst_password
  tls_certificate.pem:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/tls_certificate.pem
  tls_private_key.pem:
    file: ${BANK_SECRETS_DIR:-${HOME}/.config/java-engineering-course/sprint10}/tls_private_key.pem
