# Spring Boot picks this file up from /zipkin/config in the official image and merges it over
# zipkin-server-shared.yml; only the deliberate deviations from the 3.6.1 defaults are listed.
zipkin:
  storage:
    # Traces are a diagnostic aid, not a system of record: they live in memory, so a pod restart drops
    # them. Logs (Elasticsearch) and metrics (Prometheus) are the persistent signals.
    type: mem
    mem:
      # Oldest traces are evicted first once the cap is reached. 100k spans fit the 128m heap set in the
      # chart with room for the query path; the 500k image default would not.
      max-spans: 100000
  query:
    # Match the in-memory retention horizon instead of the 24h default the UI would otherwise promise.
    lookback: 3600000
