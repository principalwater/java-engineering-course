{{- if not (has .Values.global.environment (list "dev" "test" "prod")) }}
{{- fail "global.environment must be dev, test or prod" }}
{{- end }}
{{- if ne .Release.Namespace (printf "bank10-%s" .Values.global.environment) }}
{{- fail "release namespace must equal bank10-<environment>" }}
{{- end }}
{{- range $name, $data := .Values.assets }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "bank.labels" $ | nindent 4 }}
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
{{- if not (hasKey .Values.assets "bank10-setup") }}
{{- fail "public assets missing: run kubernetes/prepare.py and pass its public-values.yaml" }}
{{- end }}
