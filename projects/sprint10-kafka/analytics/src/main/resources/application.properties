spring.application.name=analytics
spring.config.import=classpath:bank-common.properties,classpath:bank-service-client.properties,${BANK_CONFIG_IMPORT:zookeeper:}
bank.security.audience=analytics-api
bank.client.enabled=true
bank.delivery.enabled=false
spring.security.oauth2.client.registration.service.client-id=analytics-service
spring.security.oauth2.client.registration.service.scope=accounts.resolve
spring.flyway.locations=classpath:db/analytics
spring.jackson.deserialization.accept-float-as-int=false
spring.cassandra.contact-points=${BANK_CASSANDRA_HOST:cassandra}
spring.cassandra.port=${BANK_CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=bank_activity
spring.cassandra.username=bank_activity
spring.cassandra.request.timeout=2s
spring.cassandra.connection.connect-timeout=2s
spring.cassandra.connection.init-query-timeout=2s
spring.cassandra.config=classpath:analytics-driver.conf
spring.cassandra.schema-action=none
spring.data.cassandra.repositories.type=none
bank.analytics.clickhouse-url=${BANK_CLICKHOUSE_URL:http://clickhouse:8123}
bank.analytics.clickhouse-user=bank_writer
bank.analytics.kafka-user=bank_analytics
# Единственный внутренний брокер опционального контура; Java не создаёт topic и ACL.
spring.kafka.bootstrap-servers=${BANK_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.security.protocol=SASL_PLAINTEXT
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.admin.auto-create=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
# Буфер 1MiB и 1s metadata wait ограничивают память/блокировку двух publisher workers при отказе.
spring.kafka.producer.buffer-memory=1048576
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.properties.delivery.timeout.ms=4000
spring.kafka.producer.properties.request.timeout.ms=1000
spring.kafka.producer.properties.linger.ms=0
spring.kafka.producer.properties.max.request.size=8192
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
# Одна запись за poll ограничивает retained retry и укладывает sink I/O + backoff в 60s poll interval.
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.consumer.properties.max.partition.fetch.bytes=65536
spring.kafka.consumer.properties.fetch.max.bytes=131072
spring.kafka.consumer.properties.request.timeout.ms=5000
spring.kafka.consumer.properties.default.api.timeout.ms=5000
spring.kafka.consumer.properties.session.timeout.ms=10000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000
spring.kafka.consumer.properties.max.poll.interval.ms=60000
# Контейнер Spring может печатать record/cause; retries и quarantine пишет безопасный прикладной logger.
logging.level.org.springframework.kafka.listener=OFF
