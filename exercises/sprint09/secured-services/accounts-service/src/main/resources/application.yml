server:
  address: 127.0.0.1
  port: 19933
spring:
  application:
    name: accounts-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:19934/realms/bank-realm
          jwk-set-uri: http://127.0.0.1:19934/realms/bank-realm/protocol/openid-connect/certs
          audiences: accounts-service
management:
  endpoints:
    web:
      exposure:
        include: health
