<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Доступ к переводам</title></head><body><main><p class="eyebrow">Пользователь → Gateway → Transfer → Accounts</p><h1>Проверка доступа</h1><p>Вы вошли как <strong th:text="${username}"></strong>.</p><p th:text="${preview}"></p><form th:action="@{/transfer}" method="post"><label>Счёт отправителя<input name="fromAccountId" value="ACC-001" required pattern="ACC-[0-9]{3}"></label><label>Счёт получателя<input name="toAccountId" value="ACC-002" required pattern="ACC-[0-9]{3}"></label><label>Сумма<input name="amount" type="number" value="10.00" min="0.01" max="999999999999.99" step="0.01" required></label><button>Проверить и отправить запрос</button></form><p>Проверяются роль, право на операцию и владелец исходного счёта. Денежные остатки не изменяются.</p><form th:action="@{/logout}" method="post"><button class="secondary">Выйти</button></form></main></body></html>
