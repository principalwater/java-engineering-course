input {
  tcp {
    id => "logback-tcp"
    host => "::"
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/run/secrets/tls.crt"
    ssl_key => "/run/secrets/tls.key"
    ssl_client_authentication => "none"
    ssl_supported_protocols => ["TLSv1.2", "TLSv1.3"]
    # logstash-logback-encoder пишет по JSON-объекту на строку. Ограничение размера не даёт одной
    # незавершённой строке занять неограниченную память.
    codec => json_lines { decode_size_limit_bytes => 1048576 }
    # Обратный DNS каждого соединения заблокировал бы приём при сбое resolver.
    dns_reverse_lookup_enabled => false
    tcp_keep_alive => true
  }
}

filter {
  # Некорректный JSON может содержать учётные данные. Сохраняется только событие ошибки для учёта:
  # исходный текст codec оставляет в "message", который ниже исключается списком разрешённых полей.
  if "_jsonparsefailure" in [tags] {
    mutate {
      remove_field => ["message"]
      add_field => { "event" => "unparseable log line dropped by the pipeline" "level" => "ERROR" "service" => "unknown" }
    }
  }

  if ![service] and [application] {
    mutate { rename => { "application" => "service" } }
  }
  if ![service] {
    mutate { add_field => { "service" => "unknown" } }
  }
  if [service] !~ /^[a-z0-9][a-z0-9-]{0,39}$/ {
    mutate { replace => { "service" => "invalid" } add_tag => ["invalid_service"] }
  }

  # В индекс допускаются только идентификаторы формата W3C: ссылки в Zipkin не должны содержать
  # разметку или фрагменты запросов.
  if [traceId] {
    if [traceId] !~ /^[0-9a-f]{16}([0-9a-f]{16})?$/ {
      mutate { remove_field => ["traceId"] add_tag => ["invalid_trace_id"] }
    }
  }
  if [spanId] {
    if [spanId] !~ /^[0-9a-f]{16}$/ {
      mutate { remove_field => ["spanId"] add_tag => ["invalid_span_id"] }
    }
  }

  mutate { uppercase => ["level"] }

  # Дополнительная защита после маскирования и усечения в BankLogEncoder (поля: @timestamp, service, level,
  # logger_name, event, traceId, spanId, category): эти шаблоны перехватывают пропущенные значения
  # перед любым выводом, включая Elasticsearch.
  mutate {
    gsub => [
      "event", "(?i)\bbearer\s+[a-z0-9._~+/=-]+", "Bearer [REDACTED]",
      "event", "\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}", "[REDACTED_JWT]",
      "event", "(?i)\b(password|passwd|pwd|secret|token|api[_-]?key|authorization|client[_-]?secret)(\"?\s*[:=]\s*\"?)[^\s\",;&}]+", "\1\2[REDACTED]"
    ]
  }
  # Похожие на карты числа маскируются только после проверки Луна: простой поиск 13 цифр скрыл бы
  # и временные метки в миллисекундах Unix.
  ruby {
    code => '
      luhn = lambda do |digits|
        sum = 0
        digits.reverse.each_char.with_index do |ch, index|
          value = ch.to_i
          value *= 2 if index.odd?
          value -= 9 if value > 9
          sum += value
        end
        (sum % 10).zero?
      end
      ["event"].each do |field|
        text = event.get(field)
        next unless text.is_a?(String)
        event.set(field, text.gsub(/\b[0-9]{13,19}\b/) { |digits| luhn.call(digits) ? "[REDACTED_NUMBER]" : digits })
      end
    '
  }
  truncate {
    fields => ["event"]
    length_bytes => 4096
  }

  mutate { add_field => { "environment" => "${BANK_ENVIRONMENT:dev}" } }

  # Стабильный id документа предотвращает дубли при повторе пакета: одно событие в том же дневном
  # индексе получает 409. Id вычисляется до удаления исходных полей списком разрешений.
  fingerprint {
    source => ["@timestamp", "service", "traceId", "spanId", "level", "logger_name", "event", "category"]
    concatenate_sources => true
    method => "SHA256"
    target => "[@metadata][document_id]"
  }

  # Новое поле приложения не попадёт в индекс, пока шаблон и этот список разрешённых полей
  # не будут изменены вместе.
  prune {
    whitelist_names => [
      "^@timestamp$", "^level$", "^logger_name$", "^event$", "^category$",
      "^service$", "^traceId$", "^spanId$", "^environment$", "^tags$"
    ]
  }
}

output {
  elasticsearch {
    id => "bank-logs-elasticsearch"
    hosts => ["http://elasticsearch:9200"]
    user => "bank11_logstash_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    # Дневной индекс определяется по @timestamp события: вчерашние события при повторе попадут
    # во вчерашний индекс. Шаблон и политику хранения настраивает начальный Job, а не Logstash.
    index => "bank11-logs-%{+yyyy.MM.dd}"
    action => "create"
    document_id => "%{[@metadata][document_id]}"
    manage_template => false
    ilm_enabled => false
  }
}
