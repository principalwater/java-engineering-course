name: Java projects
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  projects:
    runs-on: ubuntu-latest
    outputs:
      sprint03: ${{ steps.detect.outputs.sprint03 }}
      sprint04: ${{ steps.detect.outputs.sprint04 }}
      sprint05: ${{ steps.detect.outputs.sprint05 }}
      sprint06: ${{ steps.detect.outputs.sprint06 }}
      sprint07: ${{ steps.detect.outputs.sprint07 }}
      sprint08: ${{ steps.detect.outputs.sprint08 }}
      exercises: ${{ steps.detect.outputs.exercises }}
      infrastructure: ${{ steps.detect.outputs.infrastructure }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test repository rules
        run: |
          node --test .github/tests/*.test.cjs
          python3 -m unittest discover -s .github/tests -p 'test_*.py'
      - name: Validate new commit messages
        run: node .github/scripts/check-commits.cjs
      - name: Detect project modules
        id: detect
        run: |
          if test -f projects/sprint03-spring-blog/pom.xml; then
            echo "sprint03=true" >> "$GITHUB_OUTPUT"
          else
            echo "sprint03=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f projects/sprint04-spring-boot-blog/build.gradle; then
            echo "sprint04=true" >> "$GITHUB_OUTPUT"
          else
            echo "sprint04=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f projects/sprint05-storefront/build.gradle; then
            echo "sprint05=true" >> "$GITHUB_OUTPUT"
          else
            echo "sprint05=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f projects/sprint06-reactive-storefront/build.gradle; then
            echo "sprint06=true" >> "$GITHUB_OUTPUT"
          else
            echo "sprint06=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f projects/sprint07-rest-service/build.gradle; then
            echo "sprint07=true" >> "$GITHUB_OUTPUT"
          else
            echo "sprint07=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f projects/sprint08-security/build.gradle; then
            echo "sprint08=true" >> "$GITHUB_OUTPUT"
          else
            echo "sprint08=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f exercises/sprint01/junit5/pom.xml; then
            echo "exercises=true" >> "$GITHUB_OUTPUT"
          else
            echo "exercises=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f infra/main.tf; then
            echo "infrastructure=true" >> "$GITHUB_OUTPUT"
          else
            echo "infrastructure=false" >> "$GITHUB_OUTPUT"
          fi
  infrastructure:
    needs: projects
    if: needs.projects.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.11.6"
          tofu_wrapper: false
      - name: Validate formatting and deployment safety
        run: |
          tofu fmt -check -recursive infra
          python3 -m unittest discover -s infra/tests -v
      - name: Plan the isolated Docker exercise
        run: |
          {
            echo "COURSE_DEPLOY_STATE=$RUNNER_TEMP/course-state"
            echo "COURSE_DEPLOY_SECRETS=$RUNNER_TEMP/course-secrets"
          } >> "$GITHUB_ENV"
          COURSE_DEPLOY_STATE="$RUNNER_TEMP/course-state" COURSE_DEPLOY_SECRETS="$RUNNER_TEMP/course-secrets" \
            python3 infra/deploy.py docker-exercise plan
      - name: Run native configuration tests
        env:
          TF_DATA_DIR: ${{ runner.temp }}/course-state/docker-exercise/providers
        run: tofu -chdir=infra test
      - name: Apply the reviewed CI plan
        run: python3 infra/deploy.py docker-exercise apply
      - name: Verify routing, persistent data and the repeated plan
        run: python3 infra/verify.py docker-exercise
      - name: Collect infrastructure diagnostics on failure
        if: failure()
        run: |
          docker ps -a --filter label=dev.principalwater.deployment=java-tofu-docker-exercise
          for name in java-tofu-docker-exercise-app java-tofu-docker-exercise-gateway java-tofu-docker-exercise-db; do
            if docker inspect "$name" >/dev/null 2>&1; then docker logs --tail 100 "$name"; fi
          done
      - name: Stop owned CI containers
        if: always()
        run: |
          docker ps -q --filter label=dev.principalwater.deployment=java-tofu-docker-exercise | xargs -r docker stop --time 30
  exercises:
    needs: projects
    if: needs.projects.outputs.exercises == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
        ports:
          - 6379/tcp
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      # Ryuk 0.12.0 from the vendor's GHCR; review image override support when upgrading Testcontainers.
      TESTCONTAINERS_RYUK_CONTAINER_IMAGE: ghcr.io/testcontainers/ryuk@sha256:dd3f023a6ed7015b3f95a49ccd65a2daf0c56e681422c12952b19a810dfa6298
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: exercises/**/pom.xml
      - name: Verify the Maven plugin and JUnit consumer
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint02/test-report-maven-plugin/pom.xml install
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint01/junit5/pom.xml test dev.principalwater.study:test-report-maven-plugin:1.0-SNAPSHOT:report
      - name: Test Spring AOP and package the exercise WAR
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint03/spring-aop/pom.xml verify
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint03/spring-mvc-jdbc/pom.xml package
      - name: Verify Gradle TestKit, plugin metadata and consumer
        working-directory: exercises/sprint02/file-transformer-gradle-plugin
        run: |
          ./gradlew --no-daemon test validatePlugins
          ./gradlew --no-daemon -p consumer countWords
      - name: Package Boot exercises with Maven and Gradle
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint04/boot-actuator/pom.xml verify dependency:build-classpath -Dmdep.outputFile=target/runtime-classpath.txt
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon -p exercises/sprint04/boot-actuator build
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint04/http-logger/pom.xml verify
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint04/boot-jdbc/pom.xml verify
      - name: Verify packaged Actuator distributions and logging starter
        run: |
          python3 .github/scripts/verify-boot-actuator.py
          python3 exercises/sprint04/http-logger/verify.py
      - name: Verify Spring Data transactions and Liquibase migrations
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint05/data-jdbc/pom.xml verify
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon -p exercises/sprint05/liquibase test
      - name: Upload sprint 05 database test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprint05-database-tests
          path: |
            exercises/sprint05/data-jdbc/target/surefire-reports/
            exercises/sprint05/liquibase/build/test-results/test/
            exercises/sprint05/liquibase/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
      - name: Run Git history exercises
        env:
          GIT_AUTHOR_NAME: Course practice
          GIT_AUTHOR_EMAIL: practice@example.invalid
          GIT_COMMITTER_NAME: Course practice
          GIT_COMMITTER_EMAIL: practice@example.invalid
        run: python3 exercises/sprint02/git/practice.py
      - name: Verify reactive sources, databases and WebFlux users
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint06/iterator-publisher/pom.xml verify
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint06/r2dbc-books/pom.xml verify
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint06/r2dbc-mysql/pom.xml verify
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon -p exercises/sprint06/webflux-users test bootJar
      - name: Upload sprint 06 reactive test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprint06-reactive-tests
          path: |
            exercises/sprint06/iterator-publisher/target/surefire-reports/
            exercises/sprint06/r2dbc-books/target/surefire-reports/
            exercises/sprint06/r2dbc-mysql/target/surefire-reports/
            exercises/sprint06/webflux-users/build/test-results/test/
            exercises/sprint06/webflux-users/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify OpenAPI contracts and Redis cache exercises
        env:
          SPRING_DATA_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint07/openapi-workshop/pom.xml verify
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint07/redis-lab/pom.xml verify
          java -jar exercises/sprint07/redis-lab/target/redis-lab.jar
      - name: Upload sprint 07 API and Redis test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprint07-api-redis-tests
          path: |
            exercises/sprint07/openapi-workshop/target/surefire-reports/
            exercises/sprint07/redis-lab/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify Keycloak OIDC login and local logout
        working-directory: exercises/sprint08/oidc-login
        run: |
          python3 init.py
          ../../sprint01/junit5/mvnw -B --no-transfer-progress verify
          oidc_pid=""
          cleanup() {
            if test -n "$oidc_pid" && kill -0 "$oidc_pid"; then
              kill "$oidc_pid"
              wait "$oidc_pid" || true
            fi
            docker compose -p ci-sprint08-oidc down
          }
          trap cleanup EXIT
          docker compose -p ci-sprint08-oidc up -d --wait --wait-timeout 180
          set -a
          . target/lab.env
          set +a
          java -jar target/oidc-login.jar > target/application.log 2>&1 &
          oidc_pid=$!
          python3 verify.py
      - name: Verify the reactive Client Credentials service pair
        working-directory: exercises/sprint08/reactive-service-pair
        run: |
          python3 init.py
          ../../sprint02/file-transformer-gradle-plugin/gradlew --no-daemon bootJar
          backend_pid=""
          frontend_pid=""
          cleanup() {
            for pair_pid in "$frontend_pid" "$backend_pid"; do
              if test -n "$pair_pid" && kill -0 "$pair_pid"; then
                kill "$pair_pid"
                wait "$pair_pid" || true
              fi
            done
            docker compose -p ci-sprint08-service-pair down
          }
          trap cleanup EXIT
          docker compose -p ci-sprint08-service-pair up -d --wait --wait-timeout 180
          java -jar backend-service/build/libs/backend-service.jar > target/backend.log 2>&1 &
          backend_pid=$!
          set -a
          . target/lab.env
          set +a
          unset COURSE_VIEWER_SECRET COURSE_WRONG_AUDIENCE_SECRET KC_BOOTSTRAP_ADMIN_PASSWORD
          java -jar frontend-service/build/libs/frontend-service.jar > target/frontend.log 2>&1 &
          frontend_pid=$!
          python3 verify.py
      - name: Prepare the exercise image mirror
        working-directory: exercises/sprint03/spring-mvc-jdbc
        run: python3 ../../../.github/scripts/prepare-project-ci.py --exercise
      - name: Start an isolated exercise Tomcat
        id: servlet
        working-directory: exercises/sprint03/spring-mvc-jdbc
        run: |
          docker compose -p ci-spring-mvc up -d
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --retry-max-time 120 http://127.0.0.1:18081/spring-web-demo/home
      - name: Verify MVC, H2 and files over HTTP
        run: python3 exercises/sprint03/spring-mvc-jdbc/verify.py
      - name: Collect exercise Tomcat diagnostics on failure
        if: failure() && steps.servlet.outcome != 'skipped'
        working-directory: exercises/sprint03/spring-mvc-jdbc
        run: docker compose -p ci-spring-mvc logs --no-color --tail 200
      - name: Stop the exercise Tomcat
        if: always() && steps.servlet.outcome != 'skipped'
        working-directory: exercises/sprint03/spring-mvc-jdbc
        run: docker compose -p ci-spring-mvc down
      - name: Prepare the Docker exercise image fallback
        working-directory: exercises/supplements/docker
        run: |
          python3 init.py
          python3 ../../../.github/scripts/prepare-project-ci.py --docker-exercise
      - name: Verify Docker routing and persistent data
        working-directory: exercises/supplements/docker
        run: |
          ../../sprint01/junit5/mvnw -B --no-transfer-progress verify
          cleanup() { docker compose -p java-supplement-docker down; }
          trap cleanup EXIT
          docker compose -p java-supplement-docker up -d --build --wait --wait-timeout 120
          python3 verify.py
  sprint03:
    needs: projects
    if: needs.projects.outputs.sprint03 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/sprint03-spring-blog
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: projects/sprint03-spring-blog/pom.xml
      - name: Run tests and build the WAR
        run: ./mvnw -B --no-transfer-progress verify
      - name: Prepare the frontend
        run: python3 frontend/prepare.py target/frontend
      - name: Check JavaScript
        run: |
          node --check target/frontend/accessibility.js
          node --check target/frontend/assets/index-CdCwR2aM.js
      - name: Test secret initialization
        run: python3 -m unittest discover -s src/test/python
      - name: Initialize local secrets
        run: python3 scripts/init-secrets.py
      - name: Prepare pinned official images with registry fallback
        run: python3 ../../.github/scripts/prepare-project-ci.py
      - name: Start Tomcat and PostgreSQL
        id: containers
        run: docker compose up -d --build --wait
      - name: Verify REST endpoints in containers
        run: python3 scripts/smoke.py
      - name: Collect container diagnostics on failure
        if: failure() && steps.containers.outcome != 'skipped'
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
      - name: Upload the WAR and JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprint03-java21
          path: |
            projects/sprint03-spring-blog/target/blog.war
            projects/sprint03-spring-blog/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop containers
        if: always() && steps.containers.outcome != 'skipped'
        run: docker compose down
  sprint04:
    needs: projects
    if: needs.projects.outputs.sprint04 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/sprint04-spring-boot-blog
    env:
      COMPOSE_PROJECT_NAME: ci-sprint04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21 and Gradle cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            projects/sprint04-spring-boot-blog/build.gradle
            projects/sprint04-spring-boot-blog/gradle/wrapper/gradle-wrapper.properties
      - name: Run Boot tests and package the executable JAR
        run: ./gradlew --no-daemon --console=plain clean check bootJar
      - name: Verify the executable JAR with local H2
        run: python3 scripts/verify-jar.py
      - name: Prepare and validate the frontend
        run: |
          python3 frontend/prepare.py build/frontend
          node --check build/frontend/accessibility.js
          for script in build/frontend/assets/*.js; do node --check "$script"; done
      - name: Test and initialize local secrets
        env:
          BLOG_SECRETS_DIR: ${{ runner.temp }}/sprint04-secrets
        run: |
          python3 -m unittest discover -s src/test/python
          python3 scripts/init-secrets.py
          {
            echo "BLOG_SECRETS_DIR=$BLOG_SECRETS_DIR"
            echo "BLOG_UID=$(id -u)"
            echo "BLOG_GID=$(id -g)"
          } >> "$GITHUB_ENV"
      - name: Prepare pinned official images with registry fallback
        run: python3 ../../.github/scripts/prepare-project-ci.py
      - name: Start the executable JAR and PostgreSQL
        id: containers
        run: docker compose up -d --build --wait
      - name: Verify REST endpoints in containers
        run: python3 scripts/smoke.py --frontend-url http://localhost:8084
      - name: Collect container diagnostics on failure
        if: failure() && steps.containers.outcome != 'skipped'
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
      - name: Upload the executable JAR and Boot test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprint04-java21
          path: |
            projects/sprint04-spring-boot-blog/build/libs/blog.jar
            projects/sprint04-spring-boot-blog/build/test-results/test/
            projects/sprint04-spring-boot-blog/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop containers
        if: always() && steps.containers.outcome != 'skipped'
        run: docker compose down
  sprint05:
    needs: projects
    if: needs.projects.outputs.sprint05 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/sprint05-storefront
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21 and Gradle cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            projects/sprint05-storefront/build.gradle
            projects/sprint05-storefront/gradle/wrapper/gradle-wrapper.properties
      - name: Run cached Boot contexts and package the executable JAR
        run: ./gradlew --no-daemon --console=plain clean check bootJar
      - name: Validate JavaScript and file-secret initialization
        run: |
          node --check src/main/resources/static/store.js
          python3 -m unittest discover -s src/test/python -v
      - name: Verify the executable JAR with native H2
        run: python3 scripts/verify-jar.py
      - name: Verify JPA and transactions with isolated PostgreSQL
        run: python3 scripts/verify-postgresql.py
      - name: Verify real ClickHouse delivery and outage recovery
        run: python3 scripts/verify-analytics.py
      - name: Initialize external runtime secrets
        env:
          STORE_SECRETS_DIR: ${{ runner.temp }}/sprint05-secrets
        run: |
          python3 scripts/init-secrets.py
          {
            echo "STORE_SECRETS_DIR=$STORE_SECRETS_DIR"
            echo "STORE_UID=$(id -u)"
            echo "STORE_GID=$(id -g)"
          } >> "$GITHUB_ENV"
      - name: Start the PostgreSQL storefront and optional analytics
        id: containers
        run: docker compose -p ci-sprint05 -f compose.yaml -f compose.analytics.yaml up -d --build --wait
      - name: Verify real cookies, CSRF and purchase forms
        run: python3 scripts/smoke.py --base-url http://localhost:8085
      - name: Collect storefront diagnostics on failure
        if: failure() && steps.containers.outcome != 'skipped'
        run: |
          docker compose -p ci-sprint05 -f compose.yaml -f compose.analytics.yaml ps -a
          docker compose -p ci-sprint05 -f compose.yaml -f compose.analytics.yaml logs --no-color --tail 150
      - name: Upload JAR and database test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprint05-java21
          path: |
            projects/sprint05-storefront/build/libs/storefront.jar
            projects/sprint05-storefront/build/test-results/
            projects/sprint05-storefront/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop owned storefront containers
        if: always() && steps.containers.outcome != 'skipped'
        run: docker compose -p ci-sprint05 -f compose.yaml -f compose.analytics.yaml down
  sprint06:
    needs: projects
    if: needs.projects.outputs.sprint06 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/sprint06-reactive-storefront
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21 and Gradle cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            projects/sprint06-reactive-storefront/build.gradle
            projects/sprint06-reactive-storefront/gradle/wrapper/gradle-wrapper.properties
      - name: Run cached Boot contexts and package the executable JAR
        run: ./gradlew --no-daemon --console=plain clean check bootJar
      - name: Validate JavaScript and file-secret initialization
        run: |
          for script in src/main/resources/static/*.js; do node --check "$script"; done
          python3 -m unittest discover -s src/test/python -v
      - name: Verify the executable JAR with native H2
        run: python3 scripts/verify-jar.py
      - name: Verify native R2DBC and transactions with isolated PostgreSQL
        run: python3 scripts/verify-postgresql.py
      - name: Verify real ClickHouse delivery and outage recovery
        run: python3 scripts/verify-analytics.py
      - name: Initialize external runtime secrets
        env:
          STORE_SECRETS_DIR: ${{ runner.temp }}/sprint06-secrets
        run: |
          python3 scripts/init-secrets.py
          {
            echo "STORE_SECRETS_DIR=$STORE_SECRETS_DIR"
