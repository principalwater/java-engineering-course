apiVersion: 1
# Every value here is public. Credentials come from Secret files through $__file{}; a literal "$" that must
# reach Grafana intact is written "$$" because provisioning expands environment variables first.
prune: true
datasources:
  - name: Bank Prometheus
    uid: bank-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 30s
      prometheusType: Prometheus
      prometheusVersion: 3.15.0
  - name: Bank Alertmanager
    uid: bank-alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
  - name: Bank Zipkin
    uid: bank-zipkin
    type: zipkin
    access: proxy
    url: http://zipkin:9411
    editable: false
    jsonData:
      nodeGraph:
        enabled: true
      # Trace -> logs: a span opens the Elasticsearch events that carry the same traceId.
      tracesToLogsV2:
        datasourceUid: bank-logs
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: 'traceId:"$${__trace.traceId}"'
  - name: Bank Logs
    uid: bank-logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    editable: false
    basicAuth: true
    basicAuthUser: bank11_grafana
    jsonData:
      # A wildcard index, not a date pattern: the daily indices bank11-logs-YYYY.MM.dd are all searched.
      index: "bank11-logs-*"
      timeField: "@timestamp"
      logMessageField: event
      logLevelField: level
      maxConcurrentShardRequests: 5
      # Logs -> trace: the traceId field of a log line links to the Zipkin datasource.
      dataLinks:
        - field: traceId
          datasourceUid: bank-zipkin
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace in Zipkin
    secureJsonData:
      basicAuthPassword: $__file{/run/secrets/grafana_es_reader_password}
