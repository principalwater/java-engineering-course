spring.application.name=blog
spring.datasource.url=jdbc:h2:file:./data/blog;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.pool-name=blog-database
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
blog.cors.origins=http://localhost,http://127.0.0.1
blog.cors.max-age=1h
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.info.env.enabled=false
