apiVersion: v1
kind: Service
metadata:
  name: edge
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  type: {{ .Values.edge.serviceType }}
  selector: {app: edge, bank10.io/instance: {{ .Release.Name }}}
  ports:
    - name: https
      port: {{ .Values.global.externalPort }}
      targetPort: https
      {{- if eq .Values.edge.serviceType "NodePort" }}
      nodePort: {{ .Values.edge.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: edge, bank10.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: edge, bank10.io/instance: {{ .Release.Name }}, bank10.io/role: application}
      annotations: {checksum/public-config: {{ index .Values.assets "bank10-edge" | toJson | sha256sum }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "bank.podSecurity" . | nindent 8 }}
      containers:
        - name: edge
          image: {{ .Values.edge.image | quote }}
          imagePullPolicy: IfNotPresent
          args: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          ports: [{name: https, containerPort: {{ .Values.global.externalPort }}}, {name: health, containerPort: 8081}]
          startupProbe:
            httpGet: &edgeHealth
              path: /healthz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: *edgeHealth
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: *edgeHealth
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/caddy, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: runtime-config, mountPath: /config}
            - {name: data, mountPath: /data}
      volumes:
        - {name: config, configMap: {name: bank10-edge}}
        - {name: secrets, secret: {secretName: {{ printf "%s-edge" .Values.global.secretPrefix }}, defaultMode: 0440}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 8Mi}}
        - {name: runtime-config, emptyDir: {medium: Memory, sizeLimit: 8Mi}}
        - {name: data, emptyDir: {medium: Memory, sizeLimit: 8Mi}}
