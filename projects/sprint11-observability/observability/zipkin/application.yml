# Официальный образ Spring Boot читает /zipkin/config поверх zipkin-server-shared.yml;
# здесь перечислены только намеренные отличия от настроек 3.6.1.
zipkin:
  storage:
    # Диагностические трассы хранятся в памяти и теряются при перезапуске Pod.
    # Долговременные сигналы сохраняют Elasticsearch и Prometheus.
    type: mem
    mem:
      # Старые span вытесняются при достижении лимита; расход heap зависит и от размера tags.
      # Лимит уменьшен относительно 500k образа, но не заменяет контроль JVM-метрик и памяти Pod.
      max-spans: 100000
  query:
    # Ограничиваем окно поиска часом: in-memory история не гарантирует стандартные 24 часа UI.
    lookback: 3600000
