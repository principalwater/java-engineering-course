name: Java projects
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  projects:
    runs-on: ubuntu-latest
    outputs:
      sprint03: ${{ steps.detect.outputs.sprint03 }}
      sprint04: ${{ steps.detect.outputs.sprint04 }}
      sprint05: ${{ steps.detect.outputs.sprint05 }}
      sprint06: ${{ steps.detect.outputs.sprint06 }}
      sprint07: ${{ steps.detect.outputs.sprint07 }}
      sprint08: ${{ steps.detect.outputs.sprint08 }}
      sprint09: ${{ steps.detect.outputs.sprint09 }}
      exercises: ${{ steps.detect.outputs.exercises }}
      observability: ${{ steps.detect.outputs.observability }}
      kafka: ${{ steps.detect.outputs.kafka }}
      infrastructure: ${{ steps.detect.outputs.infrastructure }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test repository rules
        run: |
          node --test .github/tests/*.test.cjs
          python3 -m unittest discover -s .github/tests -p 'test_*.py'
      - name: Validate new commit messages
        run: node .github/scripts/check-commits.cjs
      - name: Detect project modules
        id: detect
        run: |
          if test -f projects/sprint03-spring-blog/pom.xml; then
            echo "sprint03=true" >> "$GITHUB_OUTPUT"
          else
            echo "sprint03=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f projects/sprint04-spring-boot-blog/build.gradle; then
            echo "sprint04=true" >> "$GITHUB_OUTPUT"
          else
            echo "sprint04=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f projects/sprint05-storefront/build.gradle; then
            echo "sprint05=true" >> "$GITHUB_OUTPUT"
          else
            echo "sprint05=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f projects/sprint06-reactive-storefront/build.gradle; then
            echo "sprint06=true" >> "$GITHUB_OUTPUT"
          else
            echo "sprint06=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f projects/sprint07-rest-service/build.gradle; then
            echo "sprint07=true" >> "$GITHUB_OUTPUT"
          else
            echo "sprint07=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f projects/sprint08-security/build.gradle; then
            echo "sprint08=true" >> "$GITHUB_OUTPUT"
          else
            echo "sprint08=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f projects/sprint09-bank/build.gradle; then
            echo "sprint09=true" >> "$GITHUB_OUTPUT"
          else
            echo "sprint09=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f exercises/sprint01/junit5/pom.xml; then
            echo "exercises=true" >> "$GITHUB_OUTPUT"
          else
            echo "exercises=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f infra/main.tf; then
            echo "infrastructure=true" >> "$GITHUB_OUTPUT"
          else
            echo "infrastructure=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f exercises/sprint11/tracing-chain/build.gradle; then
            echo "observability=true" >> "$GITHUB_OUTPUT"
          else
            echo "observability=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f exercises/sprint10/kafka-clients/build.gradle; then
            echo "kafka=true" >> "$GITHUB_OUTPUT"
          else
            echo "kafka=false" >> "$GITHUB_OUTPUT"
          fi
  kafka-exercises:
    needs: projects
    if: needs.projects.outputs.kafka == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21 and Gradle cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: exercises/sprint10/**/build.gradle
      - name: Build Kafka applications and test the real Streams topology
        run: |
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon --console=plain -p exercises/sprint10/kafka-clients installDist
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon --console=plain -p exercises/sprint10/spring-kafka bootJar
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon --console=plain -p exercises/sprint10/streams test bootJar
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon --console=plain -p exercises/sprint10/event-logging bootJar
      - name: Verify native transactions ISR rebalance batching and crash replay
        run: |
          docker compose -p java-sprint10-kafka -f exercises/sprint10/broker/compose.yml up -d --wait --wait-timeout 120
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon --console=plain -p exercises/sprint10/kafka-clients kafkaTest
          python3 exercises/sprint10/kafka-clients/verify.py
      - name: Verify Spring Kafka retries SQL recovery and replay
        run: |
          python3 exercises/sprint10/spring-kafka/verify.py
          docker compose -p java-sprint10-kafka -f exercises/sprint10/broker/compose.yml stop
      - name: Install verified Kubernetes tools
        run: |
          echo "KUBECONFIG=$RUNNER_TEMP/sprint10/kubeconfig" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sprint10-tools/bin" "$RUNNER_TEMP/sprint10"
          cd "$RUNNER_TEMP/sprint10-tools"
          curl --fail --location --retry 3 -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl --fail --location --retry 3 -o kind.sha256sum https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          sed 's/kind-linux-amd64/kind/' kind.sha256sum | sha256sum --check
          curl --fail --location --retry 3 -O https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          curl --fail --location --retry 3 -O https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v4.3.1-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.3.1-linux-amd64.tar.gz
          curl --fail --location --retry 3 -o kubectl https://dl.k8s.io/release/v1.34.11/bin/linux/amd64/kubectl
          curl --fail --location --retry 3 -o kubectl.sha256 https://dl.k8s.io/release/v1.34.11/bin/linux/amd64/kubectl.sha256
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum --check
          install -m 0755 kind kubectl linux-amd64/helm bin/
          echo "$RUNNER_TEMP/sprint10-tools/bin" >> "$GITHUB_PATH"
      - name: Deploy separate Helm releases to an isolated kind cluster
        run: |
          docker network create --subnet 10.251.10.32/27 java-sprint10-kind
          KIND_EXPERIMENTAL_DOCKER_NETWORK=java-sprint10-kind kind create cluster --name java-sprint10 \
            --config exercises/sprint10/event-logging/kind.yml --kubeconfig "$KUBECONFIG" --wait 180s
          chmod 600 "$KUBECONFIG"
          bash exercises/sprint10/event-logging/deploy.sh
          python3 exercises/sprint10/event-logging/verify.py
      - name: Collect Kafka diagnostics on failure
        if: failure()
        run: |
          docker compose -p java-sprint10-kafka -f exercises/sprint10/broker/compose.yml logs --no-color --tail 80
          if test -f "$KUBECONFIG"; then
            kubectl --kubeconfig "$KUBECONFIG" -n java-sprint10 get pods,pvc
            kubectl --kubeconfig "$KUBECONFIG" -n java-sprint10 describe pods
            kubectl --kubeconfig "$KUBECONFIG" -n java-sprint10 logs deployment/event-logging --tail=80
          fi
      - name: Upload Kafka test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprint10-kafka-tests
          path: |
            exercises/sprint10/kafka-clients/build/test-results/
            exercises/sprint10/kafka-clients/build/verification/
            exercises/sprint10/spring-kafka/target/verification/
            exercises/sprint10/streams/build/test-results/
            exercises/sprint10/streams/build/reports/tests/
            exercises/sprint10/event-logging/target/verification/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop owned Kafka and kind resources
        if: always()
        run: |
          docker compose -p java-sprint10-kafka -f exercises/sprint10/broker/compose.yml stop
          if docker inspect java-sprint10-control-plane > /dev/null 2>&1; then
            if kubectl --kubeconfig "$KUBECONFIG" --request-timeout=10s -n java-sprint10 get deployment/event-logging; then
              kubectl --kubeconfig "$KUBECONFIG" --request-timeout=10s -n java-sprint10 scale deployment/event-logging --replicas=0
            fi
            if kubectl --kubeconfig "$KUBECONFIG" --request-timeout=10s -n java-sprint10 get statefulset/kafka; then
              kubectl --kubeconfig "$KUBECONFIG" --request-timeout=10s -n java-sprint10 scale statefulset/kafka --replicas=0
              kubectl --kubeconfig "$KUBECONFIG" -n java-sprint10 wait --for=delete pod/kafka-0 --timeout=90s
            fi
            docker stop java-sprint10-control-plane
          fi
  observability-exercises:
    needs: projects
    if: needs.projects.outputs.observability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21 and Gradle cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: exercises/sprint11/**/build.gradle
      - name: Build the tracing, monitoring and logging applications
        run: |
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon --console=plain -p exercises/sprint11/tracing-chain bootJar
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon --console=plain -p exercises/sprint11/monitoring bootJar
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon --console=plain -p exercises/sprint11/coffee-logging installDist
      - name: Verify real Zipkin spans and context isolation
        working-directory: exercises/sprint11/tracing-chain
        run: |
          docker compose -p java-sprint11-tracing -f compose.yml up -d
          python3 verify.py
          docker compose -p java-sprint11-tracing -f compose.yml stop
      - name: Verify metrics and the firing-to-resolved mail cycle
        working-directory: exercises/sprint11/monitoring
        run: |
          python3 init.py
          docker compose -p java-sprint11-monitoring -f compose.yml up -d --build
          python3 verify.py --alerts
          docker compose -p java-sprint11-monitoring -f compose.yml stop orders
          docker compose -p java-sprint11-monitoring -f compose.yml stop
      - name: Verify Filebeat, Kafka, Logstash, Elasticsearch and dashboard transfer
        working-directory: exercises/sprint11/coffee-logging
        run: |
          python3 init.py
          docker compose -p java-sprint11-coffee -f compose.yml up -d --wait --wait-timeout 180 kafka elasticsearch
          python3 bootstrap.py
          docker compose -p java-sprint11-coffee -f compose.yml exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic coffee-logs --partitions 1 --replication-factor 1
          python3 verify.py
          docker compose -p java-sprint11-coffee -f compose.yml up -d kibana
          python3 dashboard.py
      - name: Collect observability diagnostics on failure
        if: failure()
        run: |
          docker compose -p java-sprint11-tracing -f exercises/sprint11/tracing-chain/compose.yml logs --no-color --tail 100
          if test -f exercises/sprint11/monitoring/target/lab.env; then
            docker compose -p java-sprint11-monitoring -f exercises/sprint11/monitoring/compose.yml logs --no-color --tail 100
          fi
          if test -f exercises/sprint11/coffee-logging/target/logstash.env; then
            docker compose -p java-sprint11-coffee -f exercises/sprint11/coffee-logging/compose.yml logs --no-color --tail 100
          fi
      - name: Stop owned observability containers
        if: always()
        run: |
          docker compose -p java-sprint11-tracing -f exercises/sprint11/tracing-chain/compose.yml stop
          if test -f exercises/sprint11/monitoring/target/lab.env; then
            docker compose -p java-sprint11-monitoring -f exercises/sprint11/monitoring/compose.yml stop orders
            docker compose -p java-sprint11-monitoring -f exercises/sprint11/monitoring/compose.yml stop
          fi
          if test -f exercises/sprint11/coffee-logging/target/logstash.env; then
            docker compose -p java-sprint11-coffee -f exercises/sprint11/coffee-logging/compose.yml stop filebeat logstash kibana
            docker compose -p java-sprint11-coffee -f exercises/sprint11/coffee-logging/compose.yml stop elasticsearch kafka
          fi
  infrastructure:
    needs: projects
    if: needs.projects.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.11.6"
          tofu_wrapper: false
      - name: Install the pinned native deployment YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/course-infra-python"
          "$RUNNER_TEMP/course-infra-python/bin/python" -m pip install --disable-pip-version-check -r infra/requirements.txt
          echo "$RUNNER_TEMP/course-infra-python/bin" >> "$GITHUB_PATH"
      - name: Validate formatting and deployment safety
        run: |
          tofu fmt -check -recursive infra
          python3 -m unittest discover -s infra/tests -v
      - name: Plan the isolated Docker exercise
        run: |
          {
            echo "COURSE_DEPLOY_STATE=$RUNNER_TEMP/course-state"
            echo "COURSE_DEPLOY_SECRETS=$RUNNER_TEMP/course-secrets"
          } >> "$GITHUB_ENV"
          COURSE_DEPLOY_STATE="$RUNNER_TEMP/course-state" COURSE_DEPLOY_SECRETS="$RUNNER_TEMP/course-secrets" \
            python3 infra/deploy.py docker-exercise plan
      - name: Run native configuration tests
        env:
          TF_DATA_DIR: ${{ runner.temp }}/course-state/docker-exercise/providers
        run: tofu -chdir=infra test
      - name: Apply the reviewed CI plan
        run: python3 infra/deploy.py docker-exercise apply
      - name: Verify routing, persistent data and the repeated plan
        run: python3 infra/verify.py docker-exercise
      - name: Collect infrastructure diagnostics on failure
        if: failure()
        run: |
          docker ps -a --filter label=dev.principalwater.deployment=java-tofu-docker-exercise
          for name in java-tofu-docker-exercise-app java-tofu-docker-exercise-gateway java-tofu-docker-exercise-db; do
            if docker inspect "$name" >/dev/null 2>&1; then docker logs --tail 100 "$name"; fi
          done
      - name: Stop owned CI containers
        if: always()
        run: |
          docker ps -q --filter label=dev.principalwater.deployment=java-tofu-docker-exercise | xargs -r docker stop --time 30
  exercises:
    needs: projects
    if: needs.projects.outputs.exercises == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
        ports:
          - 6379/tcp
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      # Ryuk 0.12.0 from the vendor's GHCR; review image override support when upgrading Testcontainers.
      TESTCONTAINERS_RYUK_CONTAINER_IMAGE: ghcr.io/testcontainers/ryuk@sha256:dd3f023a6ed7015b3f95a49ccd65a2daf0c56e681422c12952b19a810dfa6298
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: exercises/**/pom.xml
      - name: Verify the Maven plugin and JUnit consumer
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint02/test-report-maven-plugin/pom.xml install
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint01/junit5/pom.xml test dev.principalwater.study:test-report-maven-plugin:1.0-SNAPSHOT:report
      - name: Test Spring AOP and package the exercise WAR
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint03/spring-aop/pom.xml verify
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint03/spring-mvc-jdbc/pom.xml package
      - name: Verify Gradle TestKit, plugin metadata and consumer
        working-directory: exercises/sprint02/file-transformer-gradle-plugin
        run: |
          ./gradlew --no-daemon test validatePlugins
          ./gradlew --no-daemon -p consumer countWords
      - name: Package Boot exercises with Maven and Gradle
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint04/boot-actuator/pom.xml verify dependency:build-classpath -Dmdep.outputFile=target/runtime-classpath.txt
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon -p exercises/sprint04/boot-actuator build
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint04/http-logger/pom.xml verify
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint04/boot-jdbc/pom.xml verify
      - name: Verify packaged Actuator distributions and logging starter
        run: |
          python3 .github/scripts/verify-boot-actuator.py
          python3 exercises/sprint04/http-logger/verify.py
      - name: Verify Spring Data transactions and Liquibase migrations
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint05/data-jdbc/pom.xml verify
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon -p exercises/sprint05/liquibase test
      - name: Upload sprint 05 database test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprint05-database-tests
          path: |
            exercises/sprint05/data-jdbc/target/surefire-reports/
            exercises/sprint05/liquibase/build/test-results/test/
            exercises/sprint05/liquibase/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
      - name: Run Git history exercises
        env:
          GIT_AUTHOR_NAME: Course practice
          GIT_AUTHOR_EMAIL: practice@example.invalid
          GIT_COMMITTER_NAME: Course practice
          GIT_COMMITTER_EMAIL: practice@example.invalid
        run: python3 exercises/sprint02/git/practice.py
      - name: Verify reactive sources, databases and WebFlux users
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint06/iterator-publisher/pom.xml verify
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint06/r2dbc-books/pom.xml verify
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint06/r2dbc-mysql/pom.xml verify
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon -p exercises/sprint06/webflux-users test bootJar
      - name: Upload sprint 06 reactive test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprint06-reactive-tests
          path: |
            exercises/sprint06/iterator-publisher/target/surefire-reports/
            exercises/sprint06/r2dbc-books/target/surefire-reports/
            exercises/sprint06/r2dbc-mysql/target/surefire-reports/
            exercises/sprint06/webflux-users/build/test-results/test/
            exercises/sprint06/webflux-users/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify OpenAPI contracts and Redis cache exercises
        env:
          SPRING_DATA_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint07/openapi-workshop/pom.xml verify
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint07/redis-lab/pom.xml verify
          java -jar exercises/sprint07/redis-lab/target/redis-lab.jar
      - name: Upload sprint 07 API and Redis test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprint07-api-redis-tests
          path: |
            exercises/sprint07/openapi-workshop/target/surefire-reports/
            exercises/sprint07/redis-lab/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify Keycloak OIDC login and local logout
        working-directory: exercises/sprint08/oidc-login
        run: |
          python3 init.py
          ../../sprint01/junit5/mvnw -B --no-transfer-progress verify
          oidc_pid=""
          cleanup() {
            if test -n "$oidc_pid" && kill -0 "$oidc_pid"; then
              kill "$oidc_pid"
              wait "$oidc_pid" || true
            fi
            docker compose -p ci-sprint08-oidc down
          }
          trap cleanup EXIT
          docker compose -p ci-sprint08-oidc up -d --wait --wait-timeout 180
          set -a
          . target/lab.env
          set +a
          java -jar target/oidc-login.jar > target/application.log 2>&1 &
          oidc_pid=$!
          python3 verify.py
      - name: Verify the reactive Client Credentials service pair
        working-directory: exercises/sprint08/reactive-service-pair
        run: |
          python3 init.py
          ../../sprint02/file-transformer-gradle-plugin/gradlew --no-daemon bootJar
          backend_pid=""
          frontend_pid=""
          cleanup() {
            for pair_pid in "$frontend_pid" "$backend_pid"; do
              if test -n "$pair_pid" && kill -0 "$pair_pid"; then
                kill "$pair_pid"
                wait "$pair_pid" || true
              fi
            done
            docker compose -p ci-sprint08-service-pair down
          }
          trap cleanup EXIT
          docker compose -p ci-sprint08-service-pair up -d --wait --wait-timeout 180
          java -jar backend-service/build/libs/backend-service.jar > target/backend.log 2>&1 &
          backend_pid=$!
          set -a
          . target/lab.env
          set +a
          unset COURSE_VIEWER_SECRET COURSE_WRONG_AUDIENCE_SECRET KC_BOOTSTRAP_ADMIN_PASSWORD
          java -jar frontend-service/build/libs/frontend-service.jar > target/frontend.log 2>&1 &
          frontend_pid=$!
          python3 verify.py
      - name: Verify Config Server Gateway and remote Bus lifecycle
        working-directory: exercises/sprint09/config-bus
        run: |
          python3 init.py
          ../../sprint02/file-transformer-gradle-plugin/gradlew --no-daemon --console=plain bootJar
          cleanup() { docker compose -p ci-sprint09-config stop; }
