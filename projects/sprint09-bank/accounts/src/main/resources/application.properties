spring.application.name=accounts
spring.config.import=classpath:bank-common.properties,classpath:bank-service-client.properties,${BANK_CONFIG_IMPORT:zookeeper:}
bank.security.audience=accounts-api
bank.client.enabled=true
bank.analytics.enabled=${BANK_ANALYTICS_ENABLED:false}
spring.security.oauth2.client.registration.service.client-id=accounts-service
spring.security.oauth2.client.registration.service.scope=notifications.write,analytics.write
spring.flyway.locations=classpath:db/accounts,classpath:db/delivery
