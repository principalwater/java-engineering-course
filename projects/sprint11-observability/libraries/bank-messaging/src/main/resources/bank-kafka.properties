spring.kafka.bootstrap-servers=${BANK_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.security.protocol=SASL_PLAINTEXT
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.properties.delivery.timeout.ms=4000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.properties.max.poll.interval.ms=60000
spring.kafka.consumer.properties.default.api.timeout.ms=10000
spring.kafka.consumer.properties.request.timeout.ms=5000
spring.kafka.listener.auto-startup=${bank.delivery.enabled:true}
logging.level.org.apache.kafka=ERROR
logging.level.org.springframework.kafka.listener.DefaultErrorHandler=OFF
logging.level.org.springframework.kafka.listener.KafkaMessageListenerContainer=OFF
logging.level.org.springframework.kafka.listener.DeadLetterPublishingRecoverer=OFF
