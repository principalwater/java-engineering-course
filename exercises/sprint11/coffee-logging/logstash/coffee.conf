input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["coffee-logs"]
    group_id => "coffee-${OUTPUT_MODE:files}-${REPLAY_ID:main}"
    auto_offset_reset => "earliest"
    enable_auto_commit => false
    decorate_events => "basic"
  }
}
filter {
  grok {
    match => { "message" => "^%{TIME:time} %{LOGLEVEL:log_level}%{SPACE}: %{USERNAME:username} (?<coffeeSort>Бразилия|Эфиопия), (?<coffeeType>Эспрессо|Американо|Капучино): (?<volume>0,[234]|invalid)$" }
  }
  if "_grokparsefailure" in [tags] or [username] == "test" {
    drop { }
  }
  if [log_level] != "INFO" and [log_level] != "ERROR" {
    drop { }
  }
  mutate {
    add_field => {
      "[@metadata][level]" => "%{log_level}"
      # shortcut: дата берётся при обработке; для межсуточного replay используйте стабильную метку Kafka.
      "[@metadata][index]" => "coffee-logs-%{+yyyy.MM.dd}"
      "[@metadata][document_id]" => "%{[@metadata][kafka][topic]}-%{[@metadata][kafka][partition]}-%{[@metadata][kafka][offset]}"
    }
  }
  ruby {
    code => '
      hour = event.get("time")[0,2].to_i
      event.set("isNight", hour >= 22 || hour < 8)
      allowed = ["time", "coffeeSort", "coffeeType", "volume", "isNight", "@metadata"]
      event.to_hash.keys.each { |key| event.remove(key) unless allowed.include?(key) }
    '
  }
  if "${OUTPUT_MODE:files}" != "files" {
    mutate { add_field => { "log_level" => "%{[@metadata][level]}" } }
  }
}
output {
  if "${OUTPUT_MODE:files}" == "files" {
    if [@metadata][level] == "INFO" {
      file { path => "/output/coffee-processed.txt" codec => json_lines }
    } else {
      file { path => "/output/coffee-errors.txt" codec => json_lines }
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "coffee_writer"
      password => "${COFFEE_WRITER_PASSWORD}"
      ilm_enabled => false
      manage_template => false
      action => "index"
      index => "%{[@metadata][index]}"
      document_id => "%{[@metadata][document_id]}"
      pipeline => "coffee-ingested"
    }
  }
}
