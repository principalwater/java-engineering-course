{{- $obs := .Values.global.observability }}
{{- if and $obs.enabled $obs.logging.enabled }}
{{- $elkAsset := .Values.assets }}
{{- $release := .Release.Name }}
{{- $prefix := .Values.global.secretPrefix }}
{{- $environment := .Values.global.environment }}
{{- $claims := dict "elasticsearch-data" $obs.storage.elasticsearch "logstash-data" $obs.storage.logstash }}
{{- range $name, $size := $claims }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "bank.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $.Values.global.storageClass }}
  resources:
    requests: {storage: {{ $size }}}
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  ipFamilyPolicy: RequireDualStack
  ipFamilies: [IPv4, IPv6]
  selector: {app: elasticsearch, bank11.io/instance: {{ $release }}}
  ports: [{name: http, port: 9200, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  ipFamilyPolicy: RequireDualStack
  ipFamilies: [IPv4, IPv6]
  selector: {app: kibana, bank11.io/instance: {{ $release }}}
  ports: [{name: http, port: 5601, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  ipFamilyPolicy: RequireDualStack
  ipFamilies: [IPv4, IPv6]
  selector: {app: logstash, bank11.io/instance: {{ $release }}}
  ports:
    - {name: logback, port: 5044, targetPort: logback}
    - {name: api, port: 9600, targetPort: api}
    - {name: metrics, port: 9198, targetPort: metrics}
{{- /* ---------------------------------------------------------------- Elasticsearch */}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels: {app: elasticsearch, bank11.io/instance: {{ $release }}}
  template:
    metadata:
      labels: {app: elasticsearch, bank11.io/instance: {{ $release }}, bank11.io/role: storage}
      annotations: {checksum/public-config: {{ pick $elkAsset "elasticsearch.yml" "elasticsearch-probe.sh" | toJson | sha256sum }}}
    spec:
      automountServiceAccountToken: false
      # Service links подставили бы ELASTICSEARCH_*, LOGSTASH_* и другие переменные в образы, читающие настройки из окружения.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Elasticsearch пишет keystore в каталог config, а корневая файловая система read-only:
        # создаётся доступная для записи копия штатных настроек с нашим elasticsearch.yml поверх.
        - name: config-seed
          image: {{ $obs.images.elasticsearch | quote }}
          command: [sh, -ec, "cp -R /usr/share/elasticsearch/config/. /seed/ && cp /setup/elasticsearch.yml /seed/elasticsearch.yml && find /seed -mindepth 1 -exec chmod u+rwX,g+rX {} +"]
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $obs.resources.job | nindent 12 }}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: config, mountPath: /seed}
      containers:
        - name: elasticsearch
          image: {{ $obs.images.elasticsearch | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: ES_JAVA_OPTS, value: "-Xms256m -Xmx256m"}
            - {name: ELASTIC_PASSWORD_FILE, value: /run/secrets/elastic_password}
          ports: [{name: http, containerPort: 9200}]
          startupProbe:
            exec: {command: [sh, /setup/elasticsearch-probe.sh, ready]}
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 120
          readinessProbe:
            exec: {command: [sh, /setup/elasticsearch-probe.sh, ready]}
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            exec: {command: [sh, /setup/elasticsearch-probe.sh, live]}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $obs.resources.elasticsearch | nindent 12 }}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: config, mountPath: /usr/share/elasticsearch/config}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: data, mountPath: /usr/share/elasticsearch/data}
            - {name: logs, mountPath: /usr/share/elasticsearch/logs}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: setup
          configMap:
            name: bank11-elk
            items:
              - {key: elasticsearch.yml, path: elasticsearch.yml}
              - {key: elasticsearch-probe.sh, path: elasticsearch-probe.sh}
        - {name: config, emptyDir: {sizeLimit: 16Mi}}
        - name: secrets
          secret:
            secretName: {{ printf "%s-elasticsearch" $prefix }}
            defaultMode: 0440
            items: [{key: elastic_password, path: elastic_password}]
        - {name: data, persistentVolumeClaim: {claimName: elasticsearch-data}}
        - {name: logs, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-bootstrap-{{ dict "script" (pick $elkAsset "elasticsearch-bootstrap.sh" "ilm-policy.json" "index-template.json") "retention" $obs.retention.logsTime | toJson | sha256sum | trunc 10 }}
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {app: elasticsearch-bootstrap, bank11.io/instance: {{ $release }}, bank11.io/role: initializer}
    spec:
      automountServiceAccountToken: false
      # Service links подставили бы ELASTICSEARCH_*, LOGSTASH_* и другие переменные в образы, читающие настройки из окружения.
      enableServiceLinks: false
      restartPolicy: Never
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: {{ $obs.images.elasticsearch | quote }}
          command: [sh, /setup/elasticsearch-bootstrap.sh]
          env:
            - {name: LOGS_RETENTION, value: {{ $obs.retention.logsTime | quote }}}
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $obs.resources.job | nindent 12 }}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: setup
          configMap:
            name: bank11-elk
            items:
              - {key: elasticsearch-bootstrap.sh, path: elasticsearch-bootstrap.sh}
              - {key: ilm-policy.json, path: ilm-policy.json}
              - {key: index-template.json, path: index-template.json}
        - name: secrets
          secret:
            secretName: {{ printf "%s-elasticsearch" $prefix }}
            defaultMode: 0440
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 8Mi}}

{{- /* ---------------------------------------------------------------- Kibana */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: kibana, bank11.io/instance: {{ $release }}}
  template:
    metadata:
      labels: {app: kibana, bank11.io/instance: {{ $release }}, bank11.io/role: observability}
      annotations: {checksum/public-config: {{ pick $elkAsset "kibana.yml" "kibana-start.sh" | toJson | sha256sum }}}
    spec:
      automountServiceAccountToken: false
      # Service links подставили бы ELASTICSEARCH_*, LOGSTASH_* и другие переменные в образы, читающие настройки из окружения.
      enableServiceLinks: false
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kibana
          image: {{ $obs.images.kibana | quote }}
          imagePullPolicy: IfNotPresent
          # tini из образа остаётся PID 1; скрипт запуска читает Secret перед стартом Kibana.
          command: [/bin/tini, --, /bin/bash, /setup/kibana-start.sh]
          env:
            - {name: SERVER_PUBLICBASEURL, value: {{ printf "https://%s:%v" $obs.publicHosts.kibana .Values.global.externalPort | quote }}}
            # 448 MiB вызывали V8 OOM при холодном старте; Kibana 9.4+ сама выбирает heap по cgroup.
          ports: [{name: http, containerPort: 5601}]
          startupProbe:
            httpGet: {path: /api/status, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /api/status, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            # При недоступном Elasticsearch Kibana тоже не готова, но её перезапуск не поможет:
            # liveness проверяет только приём соединений сервером Node.js.
            tcpSocket: {port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $obs.resources.kibana | nindent 12 }}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: settings, mountPath: /usr/share/kibana/config/kibana.yml, subPath: kibana.yml, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: data, mountPath: /usr/share/kibana/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: setup
          configMap:
            name: bank11-elk
            items: [{key: kibana-start.sh, path: kibana-start.sh}]
        - name: settings
          configMap:
            name: bank11-elk
            items: [{key: kibana.yml, path: kibana.yml}]
        - name: secrets
          secret:
            secretName: {{ printf "%s-kibana" $prefix }}
            defaultMode: 0440
            items:
              - {key: kibana_system_password, path: kibana_system_password}
              - {key: kibana_encryption_key, path: kibana_encryption_key}
        - {name: data, emptyDir: {sizeLimit: 256Mi}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-bootstrap-{{ pick $elkAsset "kibana-bootstrap.sh" "kibana-data-view.json" "kibana-objects.ndjson" | toJson | sha256sum | trunc 10 }}
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {app: kibana-bootstrap, bank11.io/instance: {{ $release }}, bank11.io/role: initializer}
    spec:
      automountServiceAccountToken: false
      # Service links подставили бы ELASTICSEARCH_*, LOGSTASH_* и другие переменные в образы, читающие настройки из окружения.
      enableServiceLinks: false
      restartPolicy: Never
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: {{ $obs.images.kibana | quote }}
          command: [/bin/bash, /setup/kibana-bootstrap.sh]
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $obs.resources.job | nindent 12 }}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: setup
          configMap:
            name: bank11-elk
            items:
              - {key: kibana-bootstrap.sh, path: kibana-bootstrap.sh}
              - {key: kibana-data-view.json, path: kibana-data-view.json}
              - {key: kibana-objects.ndjson, path: kibana-objects.ndjson}
        - name: secrets
          secret:
            secretName: {{ printf "%s-kibana" $prefix }}
            defaultMode: 0440
            items: [{key: kibana_provisioner_password, path: kibana_provisioner_password}]
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 8Mi}}

{{- /* ---------------------------------------------------------------- Logstash */}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  serviceName: logstash
  replicas: 1
  selector:
    matchLabels: {app: logstash, bank11.io/instance: {{ $release }}}
  template:
    metadata:
      labels: {app: logstash, bank11.io/instance: {{ $release }}, bank11.io/role: storage}
      annotations: {checksum/public-config: {{ pick $elkAsset "logstash.yml" "bank-logs.conf" "logstash-start.sh" "logstash-ready.sh" | toJson | sha256sum }}}
    spec:
      automountServiceAccountToken: false
      # Service links подставили бы ELASTICSEARCH_*, LOGSTASH_* и другие переменные в образы, читающие настройки из окружения.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: logstash
          image: {{ $obs.images.logstash | quote }}
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, /setup/logstash-start.sh]
          env:
            - {name: LS_JAVA_OPTS, value: "-Xms256m -Xmx256m"}
            - {name: BANK_ENVIRONMENT, value: {{ $environment | quote }}}
          ports:
            - {name: logback, containerPort: 5044}
            - {name: api, containerPort: 9600}
          startupProbe:
            exec: {command: [/bin/bash, /setup/logstash-ready.sh]}
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 120
          readinessProbe:
            exec: {command: [/bin/bash, /setup/logstash-ready.sh]}
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            httpGet: {path: /, port: api}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $obs.resources.logstash | nindent 12 }}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: settings, mountPath: /usr/share/logstash/config/logstash.yml, subPath: logstash.yml, readOnly: true}
            # Штатный pipeline образа заменяется: дополнительный .conf оставил бы включёнными Beats-вход и stdout-выход.
            - {name: settings, mountPath: /usr/share/logstash/pipeline/logstash.conf, subPath: bank-logs.conf, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: data, mountPath: /usr/share/logstash/data}
            - {name: logs, mountPath: /usr/share/logstash/logs}
            - {name: tmp, mountPath: /tmp}
        # У Logstash нет Prometheus endpoint; sidecar преобразует локальный stats API (127.0.0.1:9600).
        - name: exporter
          image: {{ $obs.images.logstashExporter | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: LOGSTASH_URL, value: "http://127.0.0.1:9600"}
            - {name: PORT, value: "9198"}
          ports: [{name: metrics, containerPort: 9198}]
          startupProbe:
            httpGet: {path: /health, port: metrics}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /health, port: metrics}
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: metrics}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $obs.resources.logstashExporter | nindent 12 }}
      volumes:
        - name: setup
          configMap:
            name: bank11-elk
            items:
              - {key: logstash-start.sh, path: logstash-start.sh}
              - {key: logstash-ready.sh, path: logstash-ready.sh}
        - name: settings
          configMap:
            name: bank11-elk
            items:
              - {key: logstash.yml, path: logstash.yml}
              - {key: bank-logs.conf, path: bank-logs.conf}
        - name: secrets
          secret:
            secretName: {{ printf "%s-logstash" $prefix }}
            defaultMode: 0440
            items:
              - {key: logstash_writer_password, path: logstash_writer_password}
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
        - {name: data, persistentVolumeClaim: {claimName: logstash-data}}
        - {name: logs, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
{{- end }}
