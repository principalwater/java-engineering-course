bind 0.0.0.0
protected-mode yes
aclfile /run/secrets/session_redis_users.acl
maxmemory 64mb
# При давлении памяти вытесняем сессии с TTL (повторный вход), а не блокируем запись всех активных пользователей.
maxmemory-policy volatile-lru
save ""
appendonly yes
# Подтверждённый выход не должен вернуться после восстановления AOF.
appendfsync always
dir /data
