<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Витрина')}"></head>
<body><header th:replace="~{fragments :: header('items')}"></header>
<main id="main">
<section class="hero"><div><p class="eyebrow">РАБОЧИЙ СТОЛ · ЛИЧНОЕ ПРОСТРАНСТВО</p><h1>Хорошие вещи.<br><span>Ясные мысли.</span></h1><p class="lead">Предметы, которые помогают сосредоточиться, создавать и чувствовать себя на своём месте.</p></div><div class="hero-mark" aria-hidden="true"><span>м</span><small>СОБРАТЬ СВОЁ</small></div></section>
<div th:replace="~{fragments :: notice}"></div>
<form class="catalog-filters" method="get" th:action="@{/items}">
<label class="search-field"><span>Найти свою вещь</span><input type="search" name="search" th:value="${query.search}" maxlength="200" placeholder="Название или описание"></label>
<label><span>Сортировка</span><select name="sort"><option value="NO" th:selected="${query.sort.name() == 'NO'}">Порядок каталога</option><option value="ALPHA" th:selected="${query.sort.name() == 'ALPHA'}">По названию</option><option value="PRICE" th:selected="${query.sort.name() == 'PRICE'}">Сначала дешевле</option></select></label>
<label><span>На странице</span><select name="pageSize"><option th:each="size : ${pageSizes}" th:value="${size}" th:text="${size}" th:selected="${size == paging.pageSize}"></option></select></label>
<input type="hidden" name="pageNumber" value="1"><button class="primary" type="submit">Показать</button>
</form>
<div class="section-heading"><h2>Коллекция мастерской</h2><p th:text="|Найдено товаров: ${totalItems}|">Найдено товаров</p></div>
<section class="product-grid" aria-label="Товары" th:if="${!items.isEmpty()}">
<article class="product-card" th:each="item : ${items}" th:attr="data-product-id=${item.id},data-price=${item.price}">
<a class="product-link" th:href="@{/items/{id}(id=${item.id})}"><div class="product-art"><img th:src="@{${item.imgPath}}" th:alt="${item.title}" width="320" height="240" loading="lazy"></div><h3 th:text="${item.title}"></h3></a>
<p class="product-description" th:text="${item.description}"></p><div class="product-price" th:text="${@display.money(item.price)}"></div>
<div th:replace="~{fragments :: quantity(${item}, @{/items}, ${query})}"></div>
</article></section>
<section class="empty-state" th:if="${items.isEmpty()}"><p class="eyebrow">ЗДЕСЬ ПОКА ТИХО</p><h2 th:text="${query.search.isEmpty()} ? 'Соберём первую коллекцию?' : 'Ничего не нашлось'"></h2><p th:text="${query.search.isEmpty()} ? 'Загрузите свой JSON-каталог или начните с восьми предметов мастерской.' : 'Попробуйте другую часть названия или описания.'"></p><a class="primary button-link" th:if="${query.search.isEmpty()}" th:href="@{/catalog}">Загрузить каталог</a><a class="secondary button-link" th:unless="${query.search.isEmpty()}" th:href="@{/items}">Сбросить поиск</a></section>
<nav class="pagination" aria-label="Страницы каталога"><a class="secondary button-link" th:if="${paging.hasPrevious}" th:href="@{/items(search=${query.search},sort=${query.sort},pageNumber=${paging.pageNumber - 1},pageSize=${paging.pageSize})}">← Назад</a><span th:text="|Страница ${paging.pageNumber}|"></span><a class="secondary button-link" th:if="${paging.hasNext}" th:href="@{/items(search=${query.search},sort=${query.sort},pageNumber=${paging.pageNumber + 1},pageSize=${paging.pageSize})}">Далее →</a></nav>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
