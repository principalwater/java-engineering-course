apiVersion: v1
kind: Service
metadata:
  name: authorization
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  selector: {app: authorization, bank10.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: authorization, bank10.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: authorization, bank10.io/instance: {{ .Release.Name }}, bank10.io/role: application}
      annotations: {checksum/public-config: {{ index .Values.assets "bank10-authorization" | toJson | sha256sum }}}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      securityContext:
        {{- include "bank.podSecurity" . | nindent 8 }}
      containers:
        - name: authorization
          image: {{ .Values.authorization.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://database:5432/bank?currentSchema=keycloak"}
            - {name: KC_DB_USERNAME, value: keycloak}
            - {name: KC_HOSTNAME, value: {{ printf "https://auth-bank.valgrind-home.localhost:%v" .Values.global.externalPort | quote }}}
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_CACHE, value: local}
            - {name: JAVA_OPTS_APPEND, value: "-Xms128m -Xmx384m -XX:ActiveProcessorCount=2"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "2", memory: 640Mi}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: data, mountPath: /opt/keycloak/data}
      volumes:
        - {name: setup, configMap: {name: bank10-authorization}}
        - {name: secrets, secret: {secretName: {{ printf "%s-authorization" .Values.global.secretPrefix }}, defaultMode: 0440}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
        - {name: data, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
