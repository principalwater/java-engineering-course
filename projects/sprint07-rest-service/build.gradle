plugins {
    id 'java'
    id 'pmd'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'dev.principalwater'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.r2dbc:r2dbc-h2'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    buildInfo()
}

pmd {
    toolVersion = '7.13.0'
    ruleSets = []
    ruleSetFiles = files('config/pmd/common.xml')
    consoleOutput = true
}

tasks.named('pmdMain') {
    ruleSetFiles = files('config/pmd/common.xml', 'config/pmd/main.xml')
}

tasks.named('jar') {
    enabled = false
}

tasks.named('bootJar') {
    archiveFileName = 'storefront.jar'
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/AnalyticsIntegrationTest.class', '**/ClickHouseClusterTest.class'
}

tasks.register('postgresTest', Test) {
    description = 'Verify R2DBC and transactional contracts against isolated PostgreSQL'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/StoreRepositoryTest.class', '**/StoreServiceTest.class', '**/AccountIntegrationTest.class'
    // Отдельный диалект проверяет реальные блокировки и ограничения, без повторения WebFlux/unit-сценариев.
    outputs.upToDateWhen { false }
    doFirst {
        if (!System.getenv('STORE_TEST_DB_URL')?.startsWith('r2dbc:postgresql:')
                || !System.getenv('STORE_TEST_DB_PASSWORD')) {
            throw new GradleException('postgresTest requires an isolated PostgreSQL URL and password')
        }
    }
}

tasks.register('analyticsTest', Test) {
    description = 'Verify durable delivery and idempotent ClickHouse aggregates'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/AnalyticsIntegrationTest.class'
    outputs.upToDateWhen { false }
    doFirst {
        if (!System.getenv('STORE_TEST_ANALYTICS_URL') || !System.getenv('STORE_TEST_CLICKHOUSE_CONTAINER')) {
            throw new GradleException('analyticsTest requires an isolated ClickHouse deployment')
        }
    }
}

tasks.register('clusterTest', Test) {
    description = 'Verify replicated shards and coordinator failover against isolated ClickHouse'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/ClickHouseClusterTest.class'
    outputs.upToDateWhen { false }
    doFirst {
        if (!System.getenv('STORE_TEST_CLUSTER_URLS') || !System.getenv('STORE_TEST_CLUSTER_CONTAINERS')) {
            throw new GradleException('clusterTest requires an isolated two-shard deployment')
        }
    }
}
