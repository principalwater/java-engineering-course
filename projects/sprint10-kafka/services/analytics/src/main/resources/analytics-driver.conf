datastax-java-driver {
  basic.request {
    timeout = 2 seconds
    consistency = LOCAL_QUORUM
  }
  advanced {
    throttler {
      class = ConcurrencyLimitingRequestThrottler
      max-concurrent-requests = 64
      max-queue-size = 0
    }
    speculative-execution-policy.class = NoSpeculativeExecutionPolicy
  }
}
