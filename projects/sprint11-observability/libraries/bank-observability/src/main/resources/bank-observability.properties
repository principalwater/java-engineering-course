# Общие настройки наблюдаемости. Подключаются из bank-common.properties и из gateway.
# Экспортёры выключены по умолчанию: тесты и холодный старт не обращаются к сети, а развёртывание
# включает их переменными окружения (см. комментарии у каждого блока).

# --- Actuator: наружу только health и prometheus, без деталей ---
# Остальные endpoint вообще не создаются, а не только скрываются из web-экспозиции.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.prometheus.access=read-only
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.discovery.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.metrics.tags.application=${spring.application.name:bank}
# Фиксированные SLO-бакеты дают реальные p95/p99 без клиентских percentiles на каждый URI.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s,5s

# --- Трассировка: W3C traceparent и Brave ---
management.tracing.propagation.produce=W3C
management.tracing.propagation.consume=W3C
# Выборка 10% — значение для эксплуатации; 1.0 включается только профилем local
# (bank-observability-local.properties).
management.tracing.sampling.probability=0.1
# Экспорт в Zipkin включается MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED=true; адрес по умолчанию —
# сервис zipkin в той же сети, MANAGEMENT_ZIPKIN_TRACING_ENDPOINT переопределяет его.
management.zipkin.tracing.export.enabled=false
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.zipkin.tracing.connect-timeout=1s
management.zipkin.tracing.read-timeout=3s

# --- JDBC: span на соединение, запрос и чтение результата, значения параметров не попадают в span ---
jdbc.datasource-proxy.include-parameter-values=false
jdbc.datasource-proxy.query.enable-logging=false
jdbc.datasource-proxy.slow-query.enable-logging=false

# --- Журнал: JSON в Logstash включается BANK_LOGGING_LOGSTASH_TRANSPORT=tcp|tls (по умолчанию none) ---
# Остальные параметры читает logback-spring.xml: bank.logging.logstash.destination (logstash:5044),
# queue-size, trust-store, trust-store-password, trust-store-type.

# --- Опрос non-web worker (Notifications): BANK_OBSERVABILITY_METRICS_SERVER_ENABLED=true ---
# Порт и адрес: bank.observability.metrics-server.port (8080) и .host (0.0.0.0).
bank.observability.metrics-server.enabled=false
