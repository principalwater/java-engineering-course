openapi: 3.0.3
info:
  title: API автомастерской
  version: 1.0.0
  description: Клиенты, заказы и состояние работ в автомастерской.
servers:
  - url: /
tags:
  - name: Customers
    description: Клиенты автомастерской
  - name: Orders
    description: Заказы и выполненные услуги
paths:
  /api/customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: Получить список клиентов
      responses:
        '200':
          description: Список клиентов
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Customer'}
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Создать клиента
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerInput'}
      responses:
        '201':
          description: Клиент создан
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/customers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Получить клиента
      responses:
        '200':
          description: Клиент найден
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: Получить список заказов
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Order'}
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Создать заказ
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderInput'}
      responses:
        '201':
          description: Заказ создан
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Получить заказ
      responses:
        '200':
          description: Заказ найден
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Orders]
      operationId: updateOrder
      summary: Обновить существующий заказ
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderInput'}
      responses:
        '200':
          description: Заказ обновлён
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Orders]
      operationId: deleteOrder
      summary: Удалить заказ
      responses:
        '204': {description: Заказ удалён}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Идентификатор сущности
      schema: {type: integer, format: int64, minimum: 1}
  headers:
    Location:
      description: Адрес созданной сущности
      schema: {type: string, format: uri-reference}
  responses:
    BadRequest:
      description: Некорректные данные
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Клиент или заказ не найден
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    OrderStatus:
      type: string
      enum: [Pending, In Progress, Completed]
      description: Состояние работ по заказу
    CustomerInput:
      type: object
      required: [name, phone, email]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        phone: {type: string, pattern: '^\+[1-9][0-9]{7,14}$'}
        email: {type: string, format: email, maxLength: 254}
    Customer:
      type: object
      required: [id, name, phone, email]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        phone: {type: string}
        email: {type: string, format: email}
    OrderInput:
      type: object
      required: [carModel, serviceType, status, price, customerId]
      properties:
        carModel: {type: string, minLength: 1, maxLength: 100}
        serviceType: {type: string, minLength: 1, maxLength: 100}
        status: {$ref: '#/components/schemas/OrderStatus'}
        price: {type: number, minimum: 0}
        customerId: {type: integer, format: int64, minimum: 1}
    Order:
      type: object
      required: [id, carModel, serviceType, status, price, customerId]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        carModel: {type: string}
        serviceType: {type: string}
        status: {$ref: '#/components/schemas/OrderStatus'}
        price: {type: number, minimum: 0}
        customerId: {type: integer, format: int64, minimum: 1}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
