# Общие сессии на отдельном Redis: store.sessions.host/port/username/namespace задаются окружением,
# пароль — файлом config tree store.sessions.password. Профиль включают добавлением к активному (SPRING_PROFILES_INCLUDE).
# Узел без доступного хранилища сессий не принимает трафик.
management.endpoint.health.group.readiness.include=readinessState,r2dbc,sessionStore
