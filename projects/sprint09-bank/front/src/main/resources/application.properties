spring.application.name=front
spring.config.import=classpath:bank-common.properties,${BANK_CONFIG_IMPORT:zookeeper:}
server.forward-headers-strategy=framework
server.servlet.session.timeout=20m
server.servlet.session.cookie.name=__Host-bank-session
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
bank.analytics.enabled=${BANK_ANALYTICS_ENABLED:false}
bank.login.client-id=bank-front
bank.login.client-secret=${spring.security.oauth2.client.registration.bank.client-secret}
bank.login.issuer=${bank.security.issuer}
bank.login.token-uri=${BANK_TOKEN_URI:http://authorization:8080/realms/bank/protocol/openid-connect/token}
bank.login.jwk-set-uri=${bank.security.jwk-set-uri}
bank.login.user-info-uri=${BANK_USER_INFO_URI:http://authorization:8080/realms/bank/protocol/openid-connect/userinfo}
spring.cloud.zookeeper.discovery.instance-port=${server.port}
