spring.threads.virtual.enabled=true
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
server.tomcat.max-connections=128
server.tomcat.accept-count=32
server.tomcat.connection-timeout=3s
server.tomcat.keep-alive-timeout=10s
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=1500
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.schema=${spring.application.name}
spring.flyway.default-schema=${spring.application.name}
spring.flyway.connect-retries=5
spring.flyway.connect-retries-interval=2s
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=5000 -c lock_timeout=2000 -c idle_in_transaction_session_timeout=10000
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.cloud.zookeeper.discovery.prefer-ip-address=false
spring.cloud.zookeeper.discovery.instance-host=${spring.application.name}
spring.cloud.zookeeper.discovery.root=/services
spring.cloud.zookeeper.connect-string=${BANK_DISCOVERY:localhost:2181}
spring.cloud.zookeeper.connection-timeout=3000
spring.cloud.zookeeper.session-timeout=15000
bank.client.connect-timeout=1s
bank.client.read-timeout=3s
bank.security.issuer=${BANK_ISSUER:https://auth-bank.valgrind-home.localhost:8449/realms/bank}
bank.security.jwk-set-uri=${BANK_JWKS:http://authorization:8080/realms/bank/protocol/openid-connect/certs}
spring.config.import=optional:configtree:/run/secrets/
