{{- range $name, $user := .Values.users }}
{{- if or (not $user.optional) $.Values.analyticsEnabled }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ printf "%s-service" $name }}
  labels:
    strimzi.io/cluster: {{ $.Values.global.kafkaCluster }}
    app.kubernetes.io/part-of: bank10
  annotations:
    helm.sh/resource-policy: keep
spec:
  authentication: {type: scram-sha-512}
  authorization:
    type: simple
    acls:
      {{- range $topic := $user.writes }}
      - resource: {type: topic, name: {{ $topic | quote }}, patternType: literal}
        operations: [Write, Describe]
        host: "*"
      {{- end }}
      {{- range $topic := $user.reads }}
      - resource: {type: topic, name: {{ $topic | quote }}, patternType: literal}
        operations: [Read, Describe]
        host: "*"
      {{- end }}
      {{- range $group := $user.groups }}
      - resource: {type: group, name: {{ $group | quote }}, patternType: literal}
        operations: [Read]
        host: "*"
      {{- end }}
      {{- if $user.writes }}
      - resource: {type: cluster}
        operations: [IdempotentWrite]
        host: "*"
      {{- end }}
{{- end }}
{{- end }}
