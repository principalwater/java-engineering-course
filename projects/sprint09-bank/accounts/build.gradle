plugins {
    id 'org.springframework.boot'
    id 'org.springframework.cloud.contract'
    id 'maven-publish'
}
dependencies {
    implementation project(':bank-runtime')
    testImplementation project(':bank-test-support')
    contractTestImplementation project(':bank-test-support')
    contractTestImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier:4.3.4'
}
sourceSets.contractTest {
    compileClasspath += sourceSets.test.output
    runtimeClasspath += sourceSets.test.output
}
contracts {
    testFramework = 'JUNIT5'
    baseClassForTests = 'dev.principalwater.bank.accounts.contract.AccountsContractBase'
    basePackageForTests = 'dev.principalwater.bank.accounts.contract.generated'
}
tasks.named('compileContractTestJava') { dependsOn tasks.named('testClasses') }
tasks.named('contractTest') { useJUnitPlatform() }
tasks.named('check') { dependsOn tasks.named('contractTest') }
configurations {
    verifiedContractStubs {
        canBeConsumed = true
        canBeResolved = false
    }
}
artifacts { verifiedContractStubs tasks.named('verifierStubsJar') }
tasks.named('pmdMain') { exclude '**/generated/**' }
tasks.named('pmdContractTest') { exclude '**/generated/**' }
tasks.named('jar') { archiveClassifier = '' }
publishing {
    publications {
        accounts(MavenPublication) {
            from components.java
            artifact tasks.named('verifierStubsJar')
            versionMapping { usage('java-api') { fromResolutionResult() }; usage('java-runtime') { fromResolutionResult() } }
        }
    }
    repositories { maven { name = 'contracts'; url = rootProject.layout.buildDirectory.dir('contract-repository') } }
}
