apiVersion: 1
providers:
  - name: bank11
    orgId: 1
    folder: Bank11
    folderUid: bank11
    type: file
    # The files are the source of truth: the UI refuses edits, and the files are re-read every minute. A
    # dashboard removed from the files stays in Grafana until an administrator deletes it deliberately.
    allowUiUpdates: false
    disableDeletion: true
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana-dashboards
      foldersFromFilesStructure: false
