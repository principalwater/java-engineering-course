api.http.host: 0.0.0.0
api.http.port: 9600
pipeline.ecs_compatibility: disabled
pipeline.workers: 1
pipeline.batch.size: 125
# Очередь на выделенном PVC сохраняет принятые от Logback события при перезапуске Logstash
# и недоступности Elasticsearch. Репликации нет: потеря тома означает потерю его событий.
queue.type: persisted
queue.max_bytes: 512mb
# Checkpoint после каждой записи: поток логов мал, выигрыш от штатных 1024 записей не оправдывает
# потерю секунды событий при сбое.
queue.checkpoint.writes: 1
# Документы, отклонённые Elasticsearch из-за mapping при dynamic: strict, сохраняются в dead letter
# queue, чтобы не блокировать pipeline и не терять события.
dead_letter_queue.enable: true
dead_letter_queue.max_bytes: 64mb
config.reload.automatic: false
log.level: warn
