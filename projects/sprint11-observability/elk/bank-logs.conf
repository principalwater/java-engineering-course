input {
  tcp {
    id => "logback-tcp"
    host => "::"
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/run/secrets/tls.crt"
    ssl_key => "/run/secrets/tls.key"
    ssl_client_authentication => "none"
    ssl_supported_protocols => ["TLSv1.2", "TLSv1.3"]
    # One JSON object per line, as written by logstash-logback-encoder. The size cap bounds the memory a
    # single unterminated line can pin.
    codec => json_lines { decode_size_limit_bytes => 1048576 }
    # Reverse DNS for every connection would stall the input on a resolver hiccup.
    dns_reverse_lookup_enabled => false
    tcp_keep_alive => true
  }
}

filter {
  # A line that is not valid JSON may still carry credentials. Keep the event so the failure is visible and
  # countable, but never the raw text (the codec leaves it in "message", which the allowlist below drops).
  if "_jsonparsefailure" in [tags] {
    mutate {
      remove_field => ["message"]
      add_field => { "event" => "unparseable log line dropped by the pipeline" "level" => "ERROR" "service" => "unknown" }
    }
  }

  if ![service] and [application] {
    mutate { rename => { "application" => "service" } }
  }
  if ![service] {
    mutate { add_field => { "service" => "unknown" } }
  }
  if [service] !~ /^[a-z0-9][a-z0-9-]{0,39}$/ {
    mutate { replace => { "service" => "invalid" } add_tag => ["invalid_service"] }
  }

  # Only W3C-shaped identifiers may reach the index: they become clickable links to Zipkin and must not be
  # able to carry markup or query fragments.
  if [traceId] {
    if [traceId] !~ /^[0-9a-f]{16}([0-9a-f]{16})?$/ {
      mutate { remove_field => ["traceId"] add_tag => ["invalid_trace_id"] }
    }
  }
  if [spanId] {
    if [spanId] !~ /^[0-9a-f]{16}$/ {
      mutate { remove_field => ["spanId"] add_tag => ["invalid_span_id"] }
    }
  }

  mutate { uppercase => ["level"] }

  # Defence in depth: BankLogEncoder redacts and truncates in the service first (fields: @timestamp, service, level,
  # logger_name, event, traceId, spanId, category); these patterns catch what slipped through. They run before
  # every output, including the Elasticsearch one.
  mutate {
    gsub => [
      "event", "(?i)\bbearer\s+[a-z0-9._~+/=-]+", "Bearer [REDACTED]",
      "event", "\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}", "[REDACTED_JWT]",
      "event", "(?i)\b(password|passwd|pwd|secret|token|api[_-]?key|authorization|client[_-]?secret)(\"?\s*[:=]\s*\"?)[^\s\",;&}]+", "\1\2[REDACTED]"
    ]
  }
  # Card-like numbers are masked only when they pass the Luhn check; a plain 13-digit match would also erase
  # every epoch-millisecond timestamp a message mentions.
  ruby {
    code => '
      luhn = lambda do |digits|
        sum = 0
        digits.reverse.each_char.with_index do |ch, index|
          value = ch.to_i
          value *= 2 if index.odd?
          value -= 9 if value > 9
          sum += value
        end
        (sum % 10).zero?
      end
      ["event"].each do |field|
        text = event.get(field)
        next unless text.is_a?(String)
        event.set(field, text.gsub(/\b[0-9]{13,19}\b/) { |digits| luhn.call(digits) ? "[REDACTED_NUMBER]" : digits })
      end
    '
  }
  truncate {
    fields => ["event"]
    length_bytes => 4096
  }

  mutate { add_field => { "environment" => "${BANK_ENVIRONMENT:dev}" } }

  # A stable document id makes a replayed batch idempotent: the same event indexed twice into the same daily
  # index collides (409) instead of duplicating. Computed before the allowlist drops its inputs.
  fingerprint {
    source => ["@timestamp", "service", "traceId", "spanId", "level", "logger_name", "event", "category"]
    concatenate_sources => true
    method => "SHA256"
    target => "[@metadata][document_id]"
  }

  # Allowlist, not blocklist: any field the application adds later stays out of the index until the template
  # and this list are changed together.
  prune {
    whitelist_names => [
      "^@timestamp$", "^level$", "^logger_name$", "^event$", "^category$",
      "^service$", "^traceId$", "^spanId$", "^environment$", "^tags$"
    ]
  }
}

output {
  elasticsearch {
    id => "bank-logs-elasticsearch"
    hosts => ["http://elasticsearch:9200"]
    user => "bank11_logstash_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    # The daily index name derives from the event's own @timestamp, so replaying yesterday's events lands in
    # yesterday's index. Template and lifecycle policy belong to the bootstrap Job, not to Logstash.
    index => "bank11-logs-%{+yyyy.MM.dd}"
    action => "create"
    document_id => "%{[@metadata][document_id]}"
    manage_template => false
    ilm_enabled => false
  }
}
