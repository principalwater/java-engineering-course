<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Выход')}"></head>
<body>
<header th:replace="~{fragments :: header('profile')}"></header>
<main id="main" class="account-page">
<div class="page-heading"><h1>Выйти из аккаунта?</h1><p class="lead" th:text="|${account.displayName}, корзина и заказы сохранятся. Завершится только сессия этого браузера.|"></p></div>
<form class="account-form" method="post" th:action="@{/account/logout}">
<button class="button primary" type="submit">Выйти</button><a class="button secondary" th:href="@{/profile}">Остаться в аккаунте</a>
</form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body></html>
