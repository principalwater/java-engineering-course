{{- $obs := .Values.global.observability }}
{{- if $obs.enabled }}
{{- $grafanaAsset := .Values.assets }}
{{- $release := .Release.Name }}
{{- $prefix := .Values.global.secretPrefix }}
{{- $claims := dict "grafana-data" $obs.storage.grafana }}
{{- range $name, $size := $claims }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "bank.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $.Values.global.storageClass }}
  resources:
    requests: {storage: {{ $size }}}
{{- end }}

{{- range $service := list (dict "name" "grafana" "port" 3000) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}
  labels:
    {{- include "bank.labels" $ | nindent 4 }}
spec:
  ipFamilyPolicy: RequireDualStack
  ipFamilies: [IPv4, IPv6]
  selector: {app: {{ $service.name }}, bank11.io/instance: {{ $release }}}
  ports: [{name: http, port: {{ $service.port }}, targetPort: http}]
{{- end }}
{{- $dashboards := list }}
{{- range $key, $_ := $grafanaAsset }}{{ if hasSuffix ".json" $key }}{{ $dashboards = append $dashboards $key }}{{ end }}{{ end }}
{{- /* ---------------------------------------------------------------- Grafana */}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  serviceName: grafana
  replicas: 1
  selector:
    matchLabels: {app: grafana, bank11.io/instance: {{ $release }}}
  template:
    metadata:
      labels: {app: grafana, bank11.io/instance: {{ $release }}, bank11.io/role: storage}
      annotations: {checksum/public-config: {{ $grafanaAsset | toJson | sha256sum }}}
    spec:
      automountServiceAccountToken: false
      # Service links подставили бы ELASTICSEARCH_*, LOGSTASH_* и другие переменные в образы, читающие настройки из окружения.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        runAsNonRoot: true
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: {{ $obs.images.grafana | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: GF_SERVER_ROOT_URL, value: {{ printf "https://%s:%v/" $obs.publicHosts.grafana .Values.global.externalPort | quote }}}
            - {name: GF_LOG_MODE, value: console}
            # Встроенный администратор нужен для аварийного доступа; штатно используется оператор только для чтения.
            - {name: GF_SECURITY_ADMIN_USER, value: bank11-admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD__FILE, value: /run/secrets/grafana_admin_password}
            # Штатный ключ подписи общедоступен; он также шифрует учётные данные источников данных в базе.
            - {name: GF_SECURITY_SECRET_KEY__FILE, value: /run/secrets/grafana_secret_key}
            - {name: GF_SECURITY_COOKIE_SECURE, value: "true"}
            - {name: GF_SECURITY_DISABLE_GRAVATAR, value: "true"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_USERS_VIEWERS_CAN_EDIT, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana-dashboards/bank-overview.json}
            # /metrics защищён basic auth: публикация Grafana через edge не открывает внутренние метрики.
            - {name: GF_METRICS_BASIC_AUTH_USERNAME, value: prometheus}
            - {name: GF_METRICS_BASIC_AUTH_PASSWORD__FILE, value: /run/secrets/grafana_metrics_password}
            # Сохраняем только используемые backend-плагины: каждый лишний запускает отдельный процесс.
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED, value: "true"}
            - {name: GF_PLUGINS_DISABLE_PLUGINS, value: "grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,tempo,cloudwatch,grafana-azure-monitor-datasource,graphite,stackdriver"}
            - {name: GOMEMLIMIT, value: 384MiB}
          ports: [{name: http, containerPort: 3000}]
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $obs.resources.grafana | nindent 12 }}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources/bank11.yaml, subPath: bank11.yaml, readOnly: true}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards/bank11.yaml, subPath: bank11.yaml, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana-dashboards, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
            - {name: logs, mountPath: /var/log/grafana}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: datasources
          configMap:
            name: bank11-grafana
            items: [{key: datasources.yaml, path: bank11.yaml}]
        - name: dashboard-provider
          configMap:
            name: bank11-grafana
            items: [{key: dashboards.yaml, path: bank11.yaml}]
        - name: dashboards
          configMap:
            name: bank11-grafana
            items:
              {{- range $dashboards }}
              - {key: {{ . }}, path: {{ . }}}
              {{- end }}
        - name: secrets
          secret:
            secretName: {{ printf "%s-grafana" $prefix }}
            defaultMode: 0440
            items:
              - {key: grafana_admin_password, path: grafana_admin_password}
              - {key: grafana_secret_key, path: grafana_secret_key}
              - {key: grafana_metrics_password, path: grafana_metrics_password}
              - {key: grafana_es_reader_password, path: grafana_es_reader_password}
        - {name: data, persistentVolumeClaim: {claimName: grafana-data}}
        - {name: logs, emptyDir: {medium: Memory, sizeLimit: 8Mi}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-bootstrap-{{ pick $grafanaAsset "grafana-bootstrap.sh" | toJson | sha256sum | trunc 10 }}
  labels:
    {{- include "bank.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {app: grafana-bootstrap, bank11.io/instance: {{ $release }}, bank11.io/role: initializer}
    spec:
      automountServiceAccountToken: false
      # Service links подставили бы ELASTICSEARCH_*, LOGSTASH_* и другие переменные в образы, читающие настройки из окружения.
      enableServiceLinks: false
      restartPolicy: Never
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: {{ $obs.images.grafana | quote }}
          command: [/bin/bash, /setup/grafana-bootstrap.sh]
          securityContext:
            {{- include "bank.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $obs.resources.job | nindent 12 }}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: setup
          configMap:
            name: bank11-grafana
            items: [{key: grafana-bootstrap.sh, path: grafana-bootstrap.sh}]
        - name: secrets
          secret:
            secretName: {{ printf "%s-grafana" $prefix }}
            defaultMode: 0440
            items:
              - {key: grafana_admin_password, path: grafana_admin_password}
              - {key: grafana_operator_password, path: grafana_operator_password}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 8Mi}}

{{- end }}
