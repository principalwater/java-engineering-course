global:
  resolve_timeout: 5m
  # The chart replaces the placeholder with observability.alerting.telegram.apiUrl: the real Bot API in
  # production, a local fake receiver that speaks POST /bot<token>/sendMessage in CI. Never a real chat in CI.
  telegram_api_url: "@TELEGRAM_API_URL@"
route:
  receiver: telegram-warning
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: telegram-critical
      repeat_interval: 1h
inhibit_rules:
  # A service whose metrics endpoint is down will also trip its latency/ratio/JVM warnings; one message is enough.
  - source_matchers:
      - alertname="BankServiceDown"
    target_matchers:
      - severity="warning"
    equal: [service]
receivers:
  - name: telegram-critical
    telegram_configs:
      # Both values are read from mounted Secret files at notification time; neither is part of this
      # configuration, the chart values or the Helm state.
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: HTML
        message: |-
          <b>[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}</b> ({{ .CommonLabels.severity }})
          {{ range .Alerts -}}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          First step: {{ .Annotations.action }}
          {{ end }}
  - name: telegram-warning
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: true
        # Warnings arrive without a notification sound; critical alerts do not.
        disable_notifications: true
        parse_mode: HTML
        message: |-
          <b>[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}</b> ({{ .CommonLabels.severity }})
          {{ range .Alerts -}}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          First step: {{ .Annotations.action }}
          {{ end }}
