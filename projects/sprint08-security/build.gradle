plugins {
    id 'base'
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'org.openapi.generator' version '7.12.0' apply false
}

allprojects {
    group = 'dev.principalwater'
    version = '1.0.0'
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'pmd'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    dependencies {
        implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'io.projectreactor:reactor-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    pmd {
        toolVersion = '7.13.0'
        ruleSets = []
        ruleSetFiles = rootProject.files('config/pmd/common.xml')
        consoleOutput = true
    }
    tasks.named('pmdMain') {
        ruleSetFiles = rootProject.files('config/pmd/common.xml', 'config/pmd/main.xml')
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-parameters'] }
    tasks.withType(Test).configureEach { useJUnitPlatform(); maxHeapSize = '384m' }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    plugins.withId('org.springframework.boot') {
        springBoot { buildInfo { excludes = ['time'] } }
        tasks.named('jar') { enabled = false }
    }
}

tasks.named('check') { dependsOn ':storefront:check', ':payments:check' }
tasks.named('build') { dependsOn ':storefront:build', ':payments:build' }
tasks.register('packageDeployment', Sync) {
    group = 'build'
    description = 'Prepare both executable JARs for the same Docker and OpenTofu deployment'
    dependsOn ':storefront:bootJar', ':payments:bootJar'
    from(project(':storefront').layout.buildDirectory.file('libs/storefront.jar'))
    from(project(':payments').layout.buildDirectory.file('libs/payments.jar'))
    into layout.buildDirectory.dir('deployment')
}
tasks.register('bootJar') { dependsOn 'packageDeployment' }
['postgresTest', 'analyticsTest', 'clusterTest', 'redisTest', 'sessionTest'].each { taskName ->
    tasks.register(taskName) { dependsOn ":storefront:${taskName}" }
}

tasks.named('postgresTest') { dependsOn ':payments:postgresTest' }
