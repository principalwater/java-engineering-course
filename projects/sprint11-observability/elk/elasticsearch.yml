# Replaces config/elasticsearch.yml from the image (copied next to the other default files by an
# init container, because the root filesystem is read-only).
cluster.name: bank11-logs
node.name: bank11-logs-0
network.host: 0.0.0.0
# One node: no shard replicas to place, no discovery or bootstrap quorum checks.
discovery.type: single-node
xpack.security.enabled: true
# Plain HTTP stays inside the namespace; every request is authenticated. Transport TLS is not needed in
# single-node mode. TLS for the HTTP listener is a separate deployment decision.
xpack.security.http.ssl.enabled: false
# Machine learning and Watcher would only consume heap on a 256m node; Kibana alerting uses neither.
xpack.ml.enabled: false
xpack.watcher.enabled: false
# No internet access is assumed or wanted: skip the GeoIP database download.
ingest.geoip.downloader.enabled: false
action.destructive_requires_name: true
# Absolute free-space watermarks. The percentage defaults would turn indices read-only on a developer
# disk that is merely 90% full, silently stopping log delivery.
cluster.routing.allocation.disk.watermark.low: 2gb
cluster.routing.allocation.disk.watermark.high: 1gb
cluster.routing.allocation.disk.watermark.flood_stage: 512mb
