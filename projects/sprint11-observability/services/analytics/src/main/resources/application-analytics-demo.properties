spring.main.web-application-type=none
# CLI работает только с уже созданной схемой и не выполняет миграции до проверки её identity.
spring.flyway.enabled=false
spring.datasource.hikari.maximum-pool-size=1
spring.cloud.zookeeper.enabled=false
spring.cloud.zookeeper.config.enabled=false
spring.cloud.zookeeper.discovery.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration,org.springframework.boot.autoconfigure.data.cassandra.CassandraDataAutoConfiguration,org.springframework.boot.autoconfigure.data.cassandra.CassandraRepositoriesAutoConfiguration
management.zipkin.tracing.export.enabled=false
bank.probes.enabled=false
bank.observability.metrics-server.enabled=false
