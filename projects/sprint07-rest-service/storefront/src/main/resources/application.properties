spring.application.name=storefront
spring.profiles.default=h2
spring.main.web-application-type=reactive
server.port=${SERVER_PORT:18086}
spring.r2dbc.pool.initial-size=1
spring.r2dbc.pool.max-size=5
spring.r2dbc.pool.max-acquire-time=5s
spring.r2dbc.pool.max-create-connection-time=5s
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/changelog/001-catalog.sql,classpath:db/changelog/002-cart.sql,classpath:db/changelog/003-orders.sql,classpath:db/changelog/004-analytics-delivery.sql,classpath:db/changelog/005-source-${spring.sql.init.platform}.sql,classpath:db/changelog/006-accounts.sql,classpath:db/changelog/007-personal-analytics.sql,classpath:db/changelog/008-catalog-revision.sql
server.shutdown=graceful
server.reactive.session.cookie.http-only=true
server.reactive.session.cookie.same-site=Lax
spring.webflux.multipart.max-in-memory-size=1MB
spring.webflux.multipart.max-disk-usage-per-part=1MB
spring.webflux.multipart.max-parts=2
spring.codec.max-in-memory-size=1MB
store.display.zone=Europe/Moscow
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,r2dbc
spring.data.redis.timeout=150ms
spring.data.redis.connect-timeout=250ms
