# Протокол Vault API поддерживается OpenBao; секреты читает штатный ConfigData, а не собственный клиент.
# В тестах без стенда сеть выключена. Kubernetes включает обязательный vault:// import и fail-fast.
spring.cloud.vault.enabled=${BANK_VAULT_ENABLED:false}
spring.cloud.vault.uri=https://openbao.bank11-system.svc.cluster.local:8200
spring.cloud.vault.authentication=KUBERNETES
spring.cloud.vault.kubernetes.role=${BANK_VAULT_ROLE:unconfigured}
spring.cloud.vault.kubernetes.service-account-token-file=/var/run/secrets/openbao/token
spring.cloud.vault.fail-fast=true
spring.cloud.vault.connection-timeout=1500
spring.cloud.vault.read-timeout=2000
spring.cloud.vault.ssl.trust-store=file:/run/trust/ca.crt
spring.cloud.vault.ssl.trust-store-type=PEM
spring.cloud.vault.ssl.enabled-protocols=TLSv1.3,TLSv1.2
spring.cloud.vault.kv.backend=kv
spring.cloud.vault.kv.backend-version=2
# Конфигурация загружается при старте, до event loop Gateway; второго reactive session manager не нужно.
spring.cloud.vault.reactive.enabled=false
spring.cloud.vault.session.lifecycle.enabled=true
spring.cloud.vault.config.lifecycle.enabled=true
