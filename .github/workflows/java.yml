name: Java projects
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  projects:
    runs-on: ubuntu-latest
    outputs:
      sprint03: ${{ steps.detect.outputs.sprint03 }}
      exercises: ${{ steps.detect.outputs.exercises }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test repository rules
        run: node --test .github/tests/*.test.cjs
      - name: Validate new commit messages
        run: node .github/scripts/check-commits.cjs
      - name: Detect project modules
        id: detect
        run: |
          if test -f projects/sprint03-spring-blog/pom.xml; then
            echo "sprint03=true" >> "$GITHUB_OUTPUT"
          else
            echo "sprint03=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f exercises/sprint01/junit5/pom.xml; then
            echo "exercises=true" >> "$GITHUB_OUTPUT"
          else
            echo "exercises=false" >> "$GITHUB_OUTPUT"
          fi
  exercises:
    needs: projects
    if: needs.projects.outputs.exercises == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Ryuk 0.12.0 from the vendor's GHCR; review image override support when upgrading Testcontainers.
      TESTCONTAINERS_RYUK_CONTAINER_IMAGE: ghcr.io/testcontainers/ryuk@sha256:dd3f023a6ed7015b3f95a49ccd65a2daf0c56e681422c12952b19a810dfa6298
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: exercises/**/pom.xml
      - name: Verify the Maven plugin and JUnit consumer
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint02/test-report-maven-plugin/pom.xml install
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint01/junit5/pom.xml test dev.principalwater.study:test-report-maven-plugin:1.0-SNAPSHOT:report
      - name: Test Spring AOP and package the exercise WAR
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint03/spring-aop/pom.xml verify
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint03/spring-mvc-jdbc/pom.xml package
      - name: Verify Gradle TestKit, plugin metadata and consumer
        working-directory: exercises/sprint02/file-transformer-gradle-plugin
        run: |
          ./gradlew --no-daemon test validatePlugins
          ./gradlew --no-daemon -p consumer countWords
      - name: Package Boot exercises with Maven and Gradle
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint04/boot-actuator/pom.xml verify dependency:build-classpath -Dmdep.outputFile=target/runtime-classpath.txt
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon -p exercises/sprint04/boot-actuator build
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint04/http-logger/pom.xml verify
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint04/boot-jdbc/pom.xml verify
      - name: Verify packaged Actuator distributions and logging starter
        run: |
          python3 .github/scripts/verify-boot-actuator.py
          python3 exercises/sprint04/http-logger/verify.py
      - name: Verify Spring Data transactions and Liquibase migrations
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint05/data-jdbc/pom.xml verify
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon -p exercises/sprint05/liquibase test
      - name: Upload sprint 05 database test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprint05-database-tests
          path: |
            exercises/sprint05/data-jdbc/target/surefire-reports/
            exercises/sprint05/liquibase/build/test-results/test/
            exercises/sprint05/liquibase/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
      - name: Run Git history exercises
        env:
          GIT_AUTHOR_NAME: Course practice
          GIT_AUTHOR_EMAIL: practice@example.invalid
          GIT_COMMITTER_NAME: Course practice
          GIT_COMMITTER_EMAIL: practice@example.invalid
        run: python3 exercises/sprint02/git/practice.py
      - name: Verify reactive sources, databases and WebFlux users
        run: |
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint06/iterator-publisher/pom.xml verify
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint06/r2dbc-books/pom.xml verify
          exercises/sprint01/junit5/mvnw -B --no-transfer-progress -f exercises/sprint06/r2dbc-mysql/pom.xml verify
          exercises/sprint02/file-transformer-gradle-plugin/gradlew --no-daemon -p exercises/sprint06/webflux-users test bootJar
      - name: Upload sprint 06 reactive test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprint06-reactive-tests
          path: |
            exercises/sprint06/iterator-publisher/target/surefire-reports/
            exercises/sprint06/r2dbc-books/target/surefire-reports/
            exercises/sprint06/r2dbc-mysql/target/surefire-reports/
            exercises/sprint06/webflux-users/build/test-results/test/
            exercises/sprint06/webflux-users/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
      - name: Prepare the exercise image mirror
        working-directory: exercises/sprint03/spring-mvc-jdbc
        run: python3 ../../../.github/scripts/prepare-sprint03-ci.py --exercise
      - name: Start an isolated exercise Tomcat
        id: servlet
        working-directory: exercises/sprint03/spring-mvc-jdbc
        run: |
          docker compose -p ci-spring-mvc up -d
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --retry-max-time 120 http://127.0.0.1:18081/spring-web-demo/home
      - name: Verify MVC, H2 and files over HTTP
        run: python3 exercises/sprint03/spring-mvc-jdbc/verify.py
      - name: Collect exercise Tomcat diagnostics on failure
        if: failure() && steps.servlet.outcome != 'skipped'
        working-directory: exercises/sprint03/spring-mvc-jdbc
        run: docker compose -p ci-spring-mvc logs --no-color --tail 200
      - name: Stop the exercise Tomcat
        if: always() && steps.servlet.outcome != 'skipped'
        working-directory: exercises/sprint03/spring-mvc-jdbc
        run: docker compose -p ci-spring-mvc down
  sprint03:
    needs: projects
    if: needs.projects.outputs.sprint03 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/sprint03-spring-blog
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: projects/sprint03-spring-blog/pom.xml
      - name: Run tests and build the WAR
        run: ./mvnw -B --no-transfer-progress verify
      - name: Prepare the frontend
        run: python3 frontend/prepare.py target/frontend
      - name: Check JavaScript
        run: |
          node --check target/frontend/accessibility.js
          node --check target/frontend/assets/index-CdCwR2aM.js
      - name: Test secret initialization
        run: python3 -m unittest discover -s src/test/python
      - name: Initialize local secrets
        run: python3 scripts/init-secrets.py
      - name: Prepare pinned CI images from the official mirror
        run: python3 ../../.github/scripts/prepare-sprint03-ci.py
      - name: Start Tomcat and PostgreSQL
        id: containers
        run: docker compose up -d --build --wait
      - name: Verify REST endpoints in containers
        run: python3 scripts/smoke.py
      - name: Collect container diagnostics on failure
        if: failure() && steps.containers.outcome != 'skipped'
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
      - name: Upload the WAR and JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprint03-java21
          path: |
            projects/sprint03-spring-blog/target/blog.war
            projects/sprint03-spring-blog/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop containers
        if: always() && steps.containers.outcome != 'skipped'
        run: docker compose down
