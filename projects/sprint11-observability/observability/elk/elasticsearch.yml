# Заменяет config/elasticsearch.yml образа: init container копирует его рядом с остальными штатными
# файлами, поскольку корневая файловая система доступна только для чтения.
cluster.name: bank11-logs
node.name: bank11-logs-0
network.host: 0.0.0.0
# Один узел: реплики shard не размещаются, поиск узлов и проверка начального кворума не нужны.
discovery.type: single-node
xpack.security.enabled: true
# HTTP остаётся внутри namespace; каждый запрос требует аутентификации. В одноузловом режиме
# transport TLS не нужен. TLS для HTTP-слушателя задаётся отдельно при развёртывании.
xpack.security.http.ssl.enabled: false
# Machine learning и Watcher лишь заняли бы часть heap в 256m; оповещения Kibana их не используют.
xpack.ml.enabled: false
xpack.watcher.enabled: false
# Интернет не требуется: загрузка базы GeoIP отключена.
ingest.geoip.downloader.enabled: false
action.destructive_requires_name: true
# Пороги свободного места заданы в байтах. Процентные значения по умолчанию сделали бы индексы
# read-only уже при заполнении рабочего диска на 90%, незаметно остановив доставку логов.
cluster.routing.allocation.disk.watermark.low: 2gb
cluster.routing.allocation.disk.watermark.high: 1gb
cluster.routing.allocation.disk.watermark.flood_stage: 512mb
