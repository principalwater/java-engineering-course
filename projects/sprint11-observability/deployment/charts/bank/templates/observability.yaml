        - name: dashboard-provider
          configMap:
            name: bank11-grafana
            items: [{key: dashboards.yaml, path: bank11.yaml}]
        - name: dashboards
          configMap:
            name: bank11-grafana
            items:
              {{- range $dashboards }}
              - {key: {{ . }}, path: {{ . }}}
              {{- end }}
        - name: secrets
          secret:
            secretName: {{ printf "%s-grafana" $prefix }}
            defaultMode: 0440
            items:
              - {key: grafana_admin_password, path: grafana_admin_password}
              - {key: grafana_secret_key, path: grafana_secret_key}
              - {key: grafana_metrics_password, path: grafana_metrics_password}
              - {key: grafana_es_reader_password, path: grafana_es_reader_password}
        - {name: data, persistentVolumeClaim: {claimName: grafana-data}}
        - {name: logs, emptyDir: {medium: Memory, sizeLimit: 8Mi}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
---
