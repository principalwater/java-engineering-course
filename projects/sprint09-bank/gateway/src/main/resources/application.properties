spring.application.name=gateway
spring.config.import=${BANK_CONFIG_IMPORT:zookeeper:},optional:configtree:/run/secrets/
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
spring.cloud.zookeeper.connect-string=${BANK_DISCOVERY:localhost:2181}
spring.cloud.zookeeper.discovery.instance-host=gateway
spring.cloud.zookeeper.discovery.instance-port=${server.port}
spring.cloud.zookeeper.connection-timeout=3000
spring.cloud.zookeeper.session-timeout=15000
spring.cloud.zookeeper.discovery.root=/services
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=1000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s
spring.cloud.gateway.server.webflux.httpclient.pool.type=FIXED
spring.cloud.gateway.server.webflux.httpclient.pool.max-connections=32
spring.cloud.gateway.server.webflux.httpclient.pool.acquire-timeout=1000
spring.cloud.loadbalancer.retry.enabled=false
# ZooKeeper уже поддерживает watch-cache; второй кеш задерживал бы регистрацию после restart.
spring.cloud.loadbalancer.cache.enabled=false
spring.codec.max-in-memory-size=64KB
bank.security.issuer=${BANK_ISSUER:https://auth-bank.valgrind-home.localhost:8449/realms/bank}
bank.security.jwk-set-uri=${BANK_JWKS:http://authorization:8080/realms/bank/protocol/openid-connect/certs}
