<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head(${item.title})}"></head>
<body><header th:replace="~{fragments :: header('items')}"></header><main id="main">
<a class="back-link" th:href="@{/items}">← В коллекцию</a>
<section class="item-detail" th:attr="data-product-id=${item.id},data-price=${item.price}">
<div class="detail-art"><img th:src="@{${item.imgPath}}" th:alt="${item.title}" width="640" height="480"></div>
<div class="detail-info"><p class="eyebrow">ПРЕДМЕТ МАСТЕРСКОЙ</p><h1 th:text="${item.title}"></h1><p class="lead" th:text="${item.description}"></p><div class="detail-price" th:text="${@display.money(item.price)}"></div><div th:replace="~{fragments :: quantity(${item}, @{/items/{id}(id=${item.id})}, ${null})}"></div><p class="quiet-note">Цена за один предмет. Оформление заказа демонстрационное, без оплаты.</p></div>
</section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
