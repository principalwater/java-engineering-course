plugins {
    id 'org.springframework.boot'
    id 'org.openapi.generator'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.34'
    runtimeOnly 'io.r2dbc:r2dbc-h2'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'
    testImplementation 'org.springframework.security:spring-security-test'
}

openApiGenerate {
    generatorName = 'spring'
    inputSpec = rootProject.file('api/payments.yaml').absolutePath
    outputDir = layout.buildDirectory.dir('generated/openapi').get().asFile.absolutePath
    apiPackage = 'dev.principalwater.payments.generated.api'
    modelPackage = 'dev.principalwater.payments.generated.model'
    configOptions = [reactive: 'true', useSpringBoot3: 'true', delegatePattern: 'true',
                     interfaceOnly: 'false', useTags: 'true', documentationProvider: 'none',
                     openApiNullable: 'false', hideGenerationTimestamp: 'true']
    globalProperties = [apis: '', models: '', supportingFiles: 'ApiUtil.java', apiTests: 'false', modelTests: 'false', apiDocs: 'false', modelDocs: 'false']
}
sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/openapi/src/main/java')
tasks.named('compileJava') { dependsOn 'openApiGenerate' }
tasks.named('pmdMain') { exclude '**/generated/**' }
tasks.named('bootJar') { archiveFileName = 'payments.jar' }

tasks.register('postgresTest', Test) {
    description = 'Verify atomic payment and ledger contracts against isolated PostgreSQL'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/PaymentsIntegrationTest.class'
    outputs.upToDateWhen { false }
    doFirst {
        if (!System.getenv('PAYMENTS_TEST_DB_URL')?.startsWith('r2dbc:postgresql:')
                || !System.getenv('PAYMENTS_TEST_DB_PASSWORD')) {
            throw new GradleException('postgresTest requires an isolated PostgreSQL payments URL and password')
        }
    }
}
