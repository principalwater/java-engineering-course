global:
  scrape_interval: 15s
  # Must not exceed scrape_interval; 10s leaves room for the slowest target (a cold JVM actuator).
  scrape_timeout: 10s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: grafana
    # Grafana protects /metrics with basic auth (GF_METRICS_BASIC_AUTH_*); both sides read the same Secret file.
    basic_auth:
      username: prometheus
      password_file: /run/secrets/grafana_metrics_password
    static_configs:
      - targets: [grafana:3000]
  - job_name: zipkin
    metrics_path: /prometheus
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: [zipkin:9411]
  - job_name: logstash
    # Logstash has no Prometheus endpoint of its own; the logstash-exporter sidecar translates its stats API.
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: [logstash:9198]
  # The Spring Boot services. The chart renders the target lists (service names, ports and the metrics path
  # per service) from apps.* into the bank11-prometheus-targets ConfigMap, so an optional service that is
  # not deployed is never scraped and never reported down.
  - job_name: bank-web
    metrics_path: /actuator/prometheus
    fallback_scrape_protocol: PrometheusText0.0.4
    # Cardinality guards. Business counters carry a login label that grows with the customer base; a scrape
    # above the limit fails as a whole (up == 0) and trips PrometheusScrapeSampleLimitHit, which is louder and
    # safer than silently filling the TSDB.
    sample_limit: 20000
    label_limit: 30
    label_value_length_limit: 200
    body_size_limit: 8MB
    file_sd_configs:
      - files: [/etc/prometheus/targets/bank-web.json]
        refresh_interval: 1m
  - job_name: bank-worker
    # Non-web services (notifications) expose a small management endpoint instead of Actuator.
    metrics_path: /actuator/prometheus
    fallback_scrape_protocol: PrometheusText0.0.4
    sample_limit: 20000
    label_limit: 30
    label_value_length_limit: 200
    body_size_limit: 8MB
    file_sd_configs:
      - files: [/etc/prometheus/targets/bank-worker.json]
        refresh_interval: 1m
  - job_name: clickhouse
    fallback_scrape_protocol: PrometheusText0.0.4
    sample_limit: 5000
    file_sd_configs:
      - files: [/etc/prometheus/targets/clickhouse.json]
        refresh_interval: 1m
    # The native endpoint exports well over a thousand series; keep only what the dashboards and alerts use.
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: >-
          ClickHouseMetrics_(MemoryTracking|TCPConnection|HTTPConnection|Query|PartsActive|DelayedInserts|BackgroundMergesAndMutationsPoolTask)|ClickHouseProfileEvents_(Query|SelectQuery|InsertQuery|FailedQuery|FailedSelectQuery|FailedInsertQuery|InsertedRows|InsertedBytes|DelayedInserts|RejectedInserts|QueryTimeMicroseconds|SelectQueryTimeMicroseconds|InsertQueryTimeMicroseconds|Merge|MergedRows)|ClickHouseAsyncMetrics_(Uptime|MemoryResident|MaxPartCountForPartition|TotalBytesOfMergeTreeTables|TotalRowsOfMergeTreeTables|NumberOfTables|DiskAvailable|DiskTotal)|ClickHouseErrorMetric_ALL
  - job_name: kafka-jmx
    # Strimzi runs the Prometheus JMX exporter inside every Kafka pod (port 9404). The headless Service
    # kafka-jmx-metrics publishes not-ready pods too, so a broker that is up but unready still shows up == 0.
    fallback_scrape_protocol: PrometheusText0.0.4
    sample_limit: 8000
    dns_sd_configs:
      - names: [kafka-jmx-metrics]
        type: A
        port: 9404
        refresh_interval: 30s
  - job_name: kafka-exporter
    # Strimzi's Kafka Exporter: consumer group lag and topic offsets, including *.DLT topics.
    fallback_scrape_protocol: PrometheusText0.0.4
    sample_limit: 8000
    static_configs:
      - targets: [kafka-exporter-metrics:9404]
