spring.application.name=cash
spring.config.import=classpath:bank-common.properties,classpath:bank-service-client.properties,${BANK_CONFIG_IMPORT:zookeeper:}
bank.security.audience=cash-api
bank.client.enabled=true
bank.workflow.enabled=true
spring.security.oauth2.client.registration.service.client-id=cash-service
spring.security.oauth2.client.registration.service.scope=accounts.cash,notifications.write
spring.flyway.locations=classpath:db/workflow,classpath:db/delivery
