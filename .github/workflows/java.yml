          docker compose -p ci-sprint09-config up -d --wait --wait-timeout 150
          python3 verify.py
      - name: Verify published contracts and real four-service OAuth boundaries
        working-directory: exercises/sprint09/secured-services
        run: |
          python3 init.py
          ../../sprint02/file-transformer-gradle-plugin/gradlew --no-daemon --console=plain \
            -Dmaven.repo.local="$PWD/target/maven" bootJar :identity:test :transfer-service:test
          cleanup() { docker compose -p ci-sprint09-security stop; }
          trap cleanup EXIT
          docker compose -p ci-sprint09-security up -d --wait --wait-timeout 150
          python3 verify.py
