// Общий слой наблюдаемости без web-зависимостей: им пользуются и HTTP-сервисы, и worker Notifications.
dependencies {
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'io.micrometer:micrometer-tracing-bridge-brave'
    api 'io.zipkin.reporter2:zipkin-reporter-brave'
    api 'io.micrometer:micrometer-registry-prometheus'
    // 1.x предназначена для Spring Boot 3.x (2.x — для Boot 4); 1.5.0 собрана против Boot 3.5.16.
    api 'net.ttddyy.observation:datasource-micrometer-spring-boot:1.5.0'
    // 8.x использует Jackson 2, как Boot 3.5; 9.0 перешла на Jackson 3 и здесь несовместима.
    api 'net.logstash.logback:logstash-logback-encoder:8.1'
    // Пул и JdbcTemplate нужны только проверке прокси JDBC; сервисы получают их от своих библиотек.
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
}
