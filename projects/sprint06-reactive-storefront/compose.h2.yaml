name: sprint05-storefront-memory
services:
  backend:
    build: .
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: h2
    ports:
      - "127.0.0.1:${WEB_PORT:-8086}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 512m
