spring:
  application:
    name: kafka-consumer
  main:
    web-application-type: none
  profiles:
    default: uuid
  datasource:
    url: jdbc:h2:mem:uuid
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: 127.0.0.1:19591,127.0.0.1:19592
    consumer:
      group-id: ${STUDY_GROUP_ID:yandex-practicum-consumer}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: 3
---
spring:
  config:
    activate:
      on-profile: orders
  datasource:
    url: jdbc:h2:file:./target/failures
  kafka:
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: dev.principalwater.study.kafka.api.Order
        spring.json.trusted.packages: dev.principalwater.study.kafka.api
        spring.json.use.type.headers: false
